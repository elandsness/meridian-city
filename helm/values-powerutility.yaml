# =============================================================================
# Meridian Power — industry config overlay (Stage 7: entity engine retrofit)
# =============================================================================
# Layer this over the base chart + your secrets to deploy a power utility
# branded instance backed by the generic entity engine:
#   ./scripts/deploy.sh install -f helm/values-custom.yaml -f helm/values-powerutility.yaml

industry:
  version: 1
  id: power-utility
  company:
    name: "Meridian Power"
    short: "Meridian Power"
    tagline: "Keeping the lights on."
    assistant:
      name: "Luma"
      persona: "the Meridian Power virtual assistant"
      supportPhone: "1-800-MERIDIAN (1-800-637-4326)"
      systemPrompt: |-
        You are Luma, the Meridian Power virtual assistant.
        Help customers with outages, service requests, billing questions, and
        energy-saving tips. If a user reports an emergency (downed power line,
        electrical fire), immediately say:
        '⚠️ Your safety is our priority. If there is a downed power line or
        electrical hazard, stay at least 30 feet away and call 911 and Meridian
        Power emergency line at 1-800-MERIDIAN right away.'

  theme:
    colors:
      brand: "#F59E0B"
      brandDeep: "#B45309"
      brandSoft: "#FBBF24"
      brandTint: "#FFFBEB"
      accent: "#10B981"
      accentSoft: "#34D399"
      accentInk: "#064E3B"
    heroImage: "https://images.unsplash.com/photo-1473341314170-576993b4d347?w=1600&q=80"
    logo: "/meridian-power-logo.svg"
    favicon: "/meridian-power_ico.svg"

  terminology:
    customer: "Ratepayer"
    customerPlural: "Ratepayers"
    request: "Service Request"
    requestPlural: "Service Requests"
    incident: "Outage"
    incidentPlural: "Outages"
    workOrder: "Work Order"
    asset: "Grid Asset"
    assetPlural: "Grid Assets"
    requestCategories:
      - outage
      - power-quality
      - meter-issue
      - safety-concern
      - maintenance-request
      - new-service
      - other
    billingTitle: "Billing & Payments"
    billingSubtitle: "Your Meridian Power service statements and payment history."
    billNoun: "utility bill"
    iotCategory1: "Transformers"
    iotCategory2: " substations"
    iotCategory3: "Smart Meters"
    iotIdPrefix1: "xfmr"
    iotIdPrefix2: "sub"
    iotIdPrefix3: "meter"
    iotZonePositions:
      north-district:     { x: 200, y: 150 }
      south-district:     { x: 700, y: 800 }
      east-substation:    { x: 900, y: 400 }
      west-substation:    { x: 100, y: 400 }
      central-hub:        { x: 500, y: 500 }

  screens:
    public:
      - home
      - { id: my-outages, template: entity-list, entityType: outage, label: "My Outages", icon: "⚡" }
      - { id: service-requests, label: "Help & Requests" }
      - billing
      - messages

    ops:
      - overview
      - id: grid-map
        template: status-map
        label: "Grid Map"
        icon: "🗺️"
        title: "Grid Assets & Infrastructure"
        source: devices
        clusterBy: zone
        viewBox: "0 0 1600 1067"
        background: { kind: image, src: "https://images.unsplash.com/photo-1477554093534-7a0da111b036?w=1600&q=80" }
      - { id: active-outages, template: entity-list, entityType: outage, label: "Active Outages" }
      - { id: work-orders, template: entity-list, entityType: work_order, label: "Work Orders" }
      - id: iot
        label: "Grid IoT Devices"
        icon: "📡"
      - { id: incidents, label: "Outages" }
      - { id: analytics, label: "Grid Analytics" }
      - demo-control

  home:
    public:
      - welcome-hero
      - id: news-ticker
        headlines:
          - "System operating normally. No major outages reported."
          - "Scheduled maintenance on Transformer XFMR-1247 at 2:00 AM."
          - "Save Energy Tip: Set your thermostat 2 degrees higher in summer."
          - "North District: Power restored to 98% of affected customers."
          - "Report a downed power line: stay 30 feet away and call 911."
      - quick-actions
      - { id: weather, template: weather-widget, mode: forecast }
      - chat-teaser

    ops:
      - { id: outage-kpi, template: entity-summary-card, entityType: outage, label: "Outages Today" }
      - { id: grid-kpi, template: entity-analytics, entityType: grid_reading, label: "Grid Load Trend" }
      - ops-overview
      - { id: outage-feed, template: activity-feed, entityTypes: [outage], maxItems: 8 }

  entities:
    outage:
      displayName: "Outage"
      displayNamePlural: "Outages"
      idPrefix: out
      fields:
        zone:          { type: string }
        location:      { type: string }
        severity:      { type: enum, values: [minor, moderate, major, critical] }
        cause:         { type: enum, values: ["weather", "equipment-fail", "vehicle-accident", "animal", "unknown"] }
        affected_customers: { type: number }
      initial: reported

      states:
        reported:         { label: "Reported",            tone: slate }
        acknowledged:     { label: "Acknowledged",        tone: amber }
        diagnosing:       { label: "Diagnosing",          tone: orange }
        repairing:        { label: "Repair In Progress",  tone: red }
        restored:         { label: "Power Restored",      tone: green, terminal: true, isKpi: true }

      transitions:
        - from: reported
          to: acknowledged
          timer: { minSeconds: 15, maxSeconds: 60 }
        - from: acknowledged
          to: diagnosing
          timer: { minSeconds: 30, maxSeconds: 180 }
        - from: diagnosing
          to: repairing
          when: { probability: 0.7 }
          timer: { minSeconds: 60, maxSeconds: 300 }
        - from: diagnosing
          to: restored
          when: { probability: 0.3 }
          timer: { minSeconds: 60, maxSeconds: 300 }
        - from: repairing
          to: restored
          timer: { minSeconds: 120, maxSeconds: 1800 }

      computed:
        position:
          type: point2d
          interpolation: easeInOut
          waypoints:
            reported:         { x: 200, "y": 100 }
            acknowledged:     { x: 350, "y": 200 }
            diagnosing:       { x: 500, "y": 150 }
            repairing:        { x: 650, "y": 250 }
            restored:         { x: 800, "y": 200 }

      generator:
        strategy: simpleSteadyState
        intervalMs: 45000
        maxActive: 8

    work_order:
      displayName: "Work Order"
      displayNamePlural: "Work Orders"
      idPrefix: wo
      fields:
        asset_type: { type: enum, values: ["transformer", "substation", "line", "meter", "switch"] }
        priority:   { type: enum, values: ["critical", "high", "standard"] }
        scheduled:  { type: boolean, default: false }
      initial: queued

      states:
        queued:       { label: "Queued",           tone: slate }
        assigned:     { label: "Assigned",         tone: blue }
        in_progress:  { label: "In Progress",      tone: amber }
        inspection:   { label: "Inspection",       tone: orange }
        completed:    { label: "Completed",        tone: green, terminal: true }

      transitions:
        - from: queued
          to: assigned
          timer: { minSeconds: 60, maxSeconds: 300 }
        - from: assigned
          to: in_progress
          timer: { minSeconds: 60, maxSeconds: 300 }
        - from: in_progress
          to: inspection
          timer: { minSeconds: 120, maxSeconds: 900 }
        - from: inspection
          to: queued
          when: { probability: 0.1 }
          timer: { minSeconds: 30, maxSeconds: 180 }
        - from: inspection
          to: completed
          timer: { minSeconds: 30, maxSeconds: 120 }

      computed:
        position:
          type: point2d
          interpolation: linear
          waypoints:
            queued:       { x: 400, "y": 600 }
            assigned:     { x: 550, "y": 700 }
            in_progress:  { x: 700, "y": 650 }
            inspection:   { x: 800, "y": 500 }
            completed:    { x: 900, "y": 400 }

      generator:
        strategy: simpleSteadyState
        intervalMs: 60000
        maxActive: 12

    grid_reading:
      displayName: "Grid Reading"
      displayNamePlural: "Readings"
      idPrefix: gr
      fields:
        zone:            { type: string }
        demand_mw:       { type: number }
        voltage_kv:      { type: number }
        frequency_hz:    { type: number }
        power_factor:    { type: number }
      initial: recorded

      states:
        recorded: { label: "Recorded", tone: slate, terminal: true }

      generator:
        strategy: simpleSteadyState
        intervalMs: 30000
        maxActive: 50

  data:
    zones:
      - north-district
      - south-district
      - east-substation
      - west-substation
      - central-hub
    requestTemplates:
      - { category: outage,            title: "Power Outage Reported",            description: "No power at 123 Main Street. Neighbors confirm same." }
      - { category: power-quality,     title: "Flickering Lights",              description: "Lights in the building flicker every few minutes." }
      - { category: meter-issue,       title: "Smart Meter Not Reporting",      description: "Smart meter MTR-4521 has not reported in 6 hours." }
      - { category: safety-concern,    title: "Downed Power Line",              description: "A power line is down on Oak Avenue after the storm." }
      - { category: maintenance-request, title: "Tree Trimming Near Lines",     description: "Tree branches are hanging over power lines on Elm Street." }
      - { category: new-service,       title: "New Service Connection",         description: "New construction at 456 Pine Road needs electrical service." }
      - { category: other,             title: "General Inquiry",                description: "Question about service or billing." }
    chatQuestions:
      - "How do I report a power outage?"
      - "What is the status of outages in my area?"
      - "When will my work order be completed?"
      - "How can I check my energy usage?"
      - "Where can I find outage maps?"
      - "How do I sign up for outage notifications?"
      - "What should I do during a power outage?"
      - "How do I report a downed power line?"
      - "Can I get time-of-use pricing?"
      - "Where can I find energy-saving tips?"

  routing:
    outage:            "Outage Response"
    power-quality:     "Power Quality Team"
    meter-issue:       "Meter Operations"
    safety-concern:    "Safety & Emergency"
    maintenance-request: "Line Maintenance"
    new-service:       "New Service Connections"
    other:             "General Operations"

  dynatrace:
    serviceNames:
      citizen-service:      "Ratepayer Portal"
      city-operations:      "Grid Operations Center"
      service-dispatch:     "Field Service Dispatch"
      api-gateway:          "Utility API Gateway"
      notification-service: "Outage Notification Engine"
      billing-service:      "Customer Billing Service"

    flowLabels:
      service-request:   "Service Request Lifecycle"
      account-creation:  "New Ratepayer Onboarding"
      iot-incident:      "Grid Incident Resolution"
      tax-payment:       "Utility Bill Payment"

    flows: [service-request, account-creation, iot-incident, tax-payment]

# =============================================================================
# Entity engine ownership — add power utility entities to each service.
# =============================================================================

customerEntityService:
  ownedTypes: "citizen,service_request,bill,cart,grid_reading"

opsEntityService:
  ownedTypes: "outage,work_order"
