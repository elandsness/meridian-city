industry:
  version: 1
  id: power-utility
  company:
    name: "PowerUnlimited"
    short: "PowerUnlimited"
    tagline: "Powering your life. Safely and reliably."
    assistant:
      name: "Volt"
      persona: "the PowerUnlimited virtual assistant"
      supportPhone: "1-800-436-PWR-U"
      systemPrompt: |-
        You are Volt, the virtual assistant for PowerUnlimited, an electric utility company.
        Help customers report power outages, check restoration times, report downed lines, 
        and view their bills. Prioritize safety—if a user mentions a downed wire, instruct 
        them to stay 30 feet away and call emergency services immediately. Be reassuring, 
        concise, and professional.
  theme:
    colors:
      brand: "#005E3C"             
      brandDeep: "#004229"         
      brandSoft: "#009A44"         
      brandTint: "#E6F4EA"         
      accent: "#E96A00"            
      accentSoft: "#FF9838"        
      accentInk: "#4A2000"         
    logo: "https://drive.google.com/uc?export=download&id=1lVEsF1Ol8bwuua0DXVXaqZvkPI01GvsD"
    favicon: "https://drive.google.com/uc?export=download&id=1vA_VHAnU0Q90KcQJPJopUggTZpH9KF9C"
  terminology:
    customer: "Customer"
    customerPlural: "Customers"
    request: "Service Request"
    requestPlural: "Service Requests"
    incident: "Grid Incident"
    incidentPlural: "Grid Incidents"
    workOrder: "Field Work Order"
    asset: "Grid Asset"
    assetPlural: "Grid Assets"
    billingTitle: "Billing & Payments"
    billingSubtitle: "Your PowerUnlimited electricity bills and payment history."
    billNoun: "electric bill"
    requestCategories: [outage, safety, streetlights, metering, other]
  screens:                         
    public:
      - home
      - { id: service-requests, label: "Outage & Service Center" }
      - { id: billing, label: "Billing & Payments" }
      - messages
    ops:
      - overview
      - { id: requests, label: "Field Dispatch" }
      - { id: incidents, label: "Grid Outages" }
      - { id: iot, label: "Smart Grid & Meters" }
      - { id: analytics, label: "Reliability & SAIDI" }
      - demo-control
  home:
    public: ["city-home", "quick-actions"]
    ops: ["ops-overview"]
  data:
    zones: ["substation-alpha", "substation-bravo", "north-district", "south-district", "metro-grid", "suburban-ring"]
    requestTemplates:
      - { category: outage, title: "Total Power Loss", description: "Entire neighborhood has been without power since 2:00 PM." }
      - { category: outage, title: "Flickering Lights", description: "Lights are browning out and flickering intermittently for the last hour." }
      - { category: safety, title: "Downed Power Line", description: "Tree branch fell and took down a line across the driveway on Elm St. Sparks visible." }
      - { category: safety, title: "Transformer Sparking", description: "Loud pop and sparks coming from the pole-mounted transformer at the corner." }
      - { category: streetlights, title: "Streetlight Outage", description: "Three consecutive streetlights on Maple Ave are completely dark." }
      - { category: metering, title: "Smart Meter Offline", description: "My smart meter display is blank and I cannot see my daily usage in the app." }
    chatQuestions:
      - "Is there a known power outage in my area?"
      - "How do I report a downed power line?"
      - "When will my power be restored?"
      - "Can I get an extension on my electric bill?"
  routing:
    outage: "Grid Operations"
    safety: "Emergency Response"
    streetlights: "Field Services"
    metering: "Advanced Metering (AMI)"
  dynatrace:
    serviceNames:
      citizen-service: "Customer Experience Portal"
      city-operations: "Grid Operations Center"
      service-dispatch: "Field Dispatch Service"
      api-gateway: "Utility API Gateway"
      notification-service: "Outage Notification Engine"
      billing-service: "CIS Billing Service"
    flowLabels:
      service-request: "Outage Reporting Lifecycle"
      account-creation: "New Customer Move-in"
      iot-incident: "Smart Grid Fault Resolution"
      tax-payment: "Utility Bill Payment"
    flows:
      - service-request
      - account-creation
      - iot-incident
      - tax-payment

