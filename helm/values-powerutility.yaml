industry:
  version: 1
  id: power-utility
  company:
    name: "PowerUnlimited"
    short: "PowerUnlimited"
    tagline: "Powering your life. Safely and reliably."
    assistant:
      name: "Volt"
      persona: "the PowerUnlimited virtual assistant"
      supportPhone: "1-800-436-PWR-U"
      systemPrompt: |-
        You are Volt, the virtual assistant for PowerUnlimited, an electric utility company.
        Help customers report power outages, check restoration times, report downed lines, 
        and view their bills. Prioritize safety—if a user mentions a downed wire, instruct 
        them to stay 30 feet away and call emergency services immediately. Be reassuring, 
        concise, and professional.
  theme:
    colors:
      brand: "#005A3C"
      brandDeep: "#003E29"
      brandSoft: "#008253"
      brandTint: "#E5F2EC"
      accent: "#F37021"
      accentSoft: "#F79459"
      accentInk: "#4A1E00"
    heroImage: "https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?w=1600&q=80"
    logo: "https://drive.usercontent.google.com/u/0/uc?id=1lVEsF1Ol8bwuua0DXVXaqZvkPI01GvsD&export=download"
    favicon: "https://drive.usercontent.google.com/u/0/uc?id=1vA_VHAnU0Q90KcQJPJopUggTZpH9KF9C&export=download"
  terminology:
    customer: "Customer"
    customerPlural: "Customers"
    request: "Service Request"
    requestPlural: "Service Requests"
    incident: "Grid Fault"
    incidentPlural: "Grid Faults"
    workOrder: "Field Work Order"
    asset: "Grid Asset"
    assetPlural: "Grid Assets"
    requestCategories: [outage-report, billing, tree-trimming, streetlights, safety-hazard, other]
    billingTitle: "Billing & Payments"
    billingSubtitle: "Your PowerUnlimited energy statements and payment history."
    billNoun: "energy bill"
  screens:
    public:
      - home
      - id: outage-tracker
        template: status-map
        label: "Outage Map"
        icon: "⚡"
        title: "Regional Grid Status"
        source: devices
        viewBox: "0 0 1600 900"
        background:
          kind: image
          src: "https://images.unsplash.com/photo-1524661135-423995f22d0b?w=1600&q=80"
      - { id: service-requests, label: "Help & Support" }
      - billing
      - messages
    ops:
      - overview
      - { id: grid-map, template: status-map, label: "Live Grid Map", icon: "🗺️", title: "Infrastructure Grid Status", source: devices, viewBox: "0 0 1600 1067", background: { kind: image, src: "https://images.unsplash.com/photo-1524661135-423995f22d0b?w=1600&q=80" } }
      - { id: active-outages, template: entity-list, entityType: outage_event, label: "Active Outages" }
      - { id: requests, label: "Field Dispatch" }
      - { id: incidents, label: "Grid Faults" }
      - { id: iot, label: "Asset Fleet" }
      - { id: analytics, label: "Reliability (SAIDI)" }
      - demo-control
  home:
    public:
      - welcome-hero
      - id: grid-news
        template: ticker
        height: slim
        label: "⚡ GRID STATUS"
        items:
          - "System operating normally. No major outages reported."
          - "Scheduled maintenance in Valley Substation at 11:00 PM."
          - "Hot weather alert: See our tips to reduce cooling costs."
      - quick-actions
      - { id: weather, template: weather-widget, mode: forecast }
      - chat-teaser
    ops:
      - { id: outage-kpi, template: entity-summary-card, entityType: outage_event, label: "Outage Events Today" }
      - ops-overview
      - { id: outage-feed, template: activity-feed, entityTypes: [outage_event], maxItems: 8 }
  entities:
    outage_event:
      displayName: "Outage Event"
      displayNamePlural: "Outage Events"
      idPrefix: out
      fields:
        customer_id: { type: string }
        location:    { type: string }
        severity:    { type: enum, values: [minor, major, critical] }
      initial: reported
      states:
        reported:         { label: "Reported", tone: slate }
        investigating:    { label: "Investigating", tone: amber }
        crew_dispatched:  { label: "Crew Dispatched", tone: blue }
        on_site:          { label: "Crew On Site", tone: orange }
        restored:         { label: "Power Restored", tone: green, terminal: true, isKpi: true }
      transitions:
        - { from: reported,        to: investigating,   timer: { minSeconds: 15, maxSeconds: 45 } }
        - { from: investigating,   to: crew_dispatched, timer: { minSeconds: 30, maxSeconds: 90 } }
        - { from: crew_dispatched, to: on_site,         timer: { minSeconds: 45, maxSeconds: 120 } }
        - { from: on_site,         to: restored,        timer: { minSeconds: 60, maxSeconds: 180 } }
      generator: { strategy: simpleSteadyState, intervalMs: 35000, maxActive: 8 }
  data:
    zones: [metro-substation, valley-substation, north-region, south-region, industrial-park]
    requestTemplates:
      - { category: outage-report, title: "Total Power Loss", description: "Entire neighborhood has been without power since 2:00 PM." }
      - { category: safety-hazard, title: "Downed Power Line", description: "Tree branch fell and took down a line across the driveway on Elm St. Sparks visible." }
      - { category: safety-hazard, title: "Transformer Sparking", description: "Loud pop and sparks coming from the pole-mounted transformer at the corner." }
      - { category: streetlights, title: "Streetlight Outage", description: "Three consecutive streetlights on Maple Ave are completely dark." }
      - { category: tree-trimming, title: "Tree near power line", description: "Branches are resting heavily on the secondary line behind the house." }
      - { category: billing, title: "Unusually high bill", description: "My bill doubled this month despite no changes in usage." }
      - { category: other, title: "Smart Meter Display Blank", description: "The digital display on my new smart meter is completely off." }
    chatQuestions:
      - "Is there a known power outage in my area?"
      - "How do I report a downed power line?"
      - "When will my power be restored?"
      - "Can I get an extension on my electric bill?"
  routing:
    outage-report: "Grid Operations"
    billing: "Customer Accounting"
    tree-trimming: "Vegetation Management"
    streetlights: "Municipal Services"
    safety-hazard: "Emergency Response"
    other: "General Support"
  dynatrace:
    serviceNames:
      citizen-service: "Customer Experience Portal"
      city-operations: "Grid Operations Center"
      service-dispatch: "Field Dispatch Service"
      api-gateway: "Utility API Gateway"
      notification-service: "Outage Notification Engine"
      billing-service: "CIS Billing Service"
    flowLabels:
      service-request: "Maintenance Request Lifecycle"
      account-creation: "New Customer Move-in"
      iot-incident: "Smart Grid Fault Resolution"
      tax-payment: "Utility Bill Payment"
    flows: [service-request, account-creation, iot-incident, tax-payment]

