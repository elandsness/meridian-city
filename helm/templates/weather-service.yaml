{{- if .Values.weatherService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian.fullname" . }}-weather-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: weather-service
spec:
  replicas: {{ .Values.weatherService.replicaCount }}
  selector:
    matchLabels:
      {{- include "meridian.selectorLabels" (dict "component" "weather-service" "context" $) | nindent 6 }}
      app.kubernetes.io/component: weather-service
  template:
    metadata:
      labels:
        {{- include "meridian.selectorLabels" (dict "component" "weather-service" "context" $) | nindent 8 }}
        app.kubernetes.io/component: weather-service
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: weather-service
          image: {{ include "meridian.image" (dict "repository" .Values.weatherService.image.repository "tag" .Values.weatherService.image.tag "context" $) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8096
          env:
            - name: PORT
              value: "8096"
            {{- if .Values.weatherService.env }}
            {{- range $key, $value := .Values.weatherService.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/weather
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/weather
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.weatherService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian.fullname" . }}-weather-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: weather-service
spec:
  type: {{ .Values.weatherService.service.type }}
  ports:
    - port: {{ .Values.weatherService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "meridian.selectorLabels" (dict "component" "weather-service" "context" $) | nindent 4 }}
    app.kubernetes.io/component: weather-service
{{- end }}
