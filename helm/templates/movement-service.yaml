{{/*
Fast, dedicated position tick (Go) for entities that declare computed.position.
Deliberately separate from entity-engine's heavier transactional business tick
-- see services/movement-service's package doc comment for why.
*/}}
{{- if .Values.movementService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: movement-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: movement-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movement-service
  template:
    metadata:
      annotations:
        checksum/entity-config: {{ include (print $.Template.BasePath "/entity-config-configmap.yaml") . | sha256sum }}
      labels:
        app: movement-service
        {{- include "meridian.labels" . | nindent 8 }}
        app.kubernetes.io/component: movement-service
    spec:
      volumes:
        - name: entity-config
          configMap:
            name: entity-config
      containers:
        - name: movement-service
          image: {{ include "meridian.image" (dict "repository" .Values.movementService.image.repository "tag" .Values.movementService.image.tag "context" $) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8095
          volumeMounts:
            - name: entity-config
              mountPath: /etc/meridian/entity-config.json
              subPath: entity-config.json
          env:
            - name: OTEL_SERVICE_NAME
              value: "movement-service"
            - name: ENTITY_CONFIG_PATH
              value: "/etc/meridian/entity-config.json"
            - name: HEALTH_PORT
              value: "8095"
            - name: MOVEMENT_TICK_MS
              value: {{ .Values.movementService.tickMs | quote }}
            {{- include "meridian.commonEnv" (dict "context" $) | nindent 12 }}
            {{- with .Values.movementService.env }}
            {{- include "meridian.extraEnv" . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.movementService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: movement-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: movement-service
spec:
  type: ClusterIP
  selector:
    app: movement-service
  ports:
    - name: http
      port: {{ .Values.movementService.service.port }}
      targetPort: 8095
{{- end }}
