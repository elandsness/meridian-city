{{- if .Values.transactionService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian.fullname" . }}-transaction-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: transaction-service
spec:
  replicas: {{ .Values.transactionService.replicaCount }}
  selector:
    matchLabels:
      {{- include "meridian.selectorLabels" (dict "component" "transaction-service" "context" $) | nindent 6 }}
      app.kubernetes.io/component: transaction-service
  template:
    metadata:
      labels:
        {{- include "meridian.selectorLabels" (dict "component" "transaction-service" "context" $) | nindent 8 }}
        app.kubernetes.io/component: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: {{ include "meridian.image" (dict "repository" .Values.transactionService.image.repository "tag" .Values.transactionService.image.tag "context" $) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://{{ include "meridian.dbRwService" . }}:5432/meridian
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian.fullname" . }}-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian.fullname" . }}-db-credentials
                  key: password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "{{ include "meridian.kafkaBootstrap" . }}:9092"
            {{- if .Values.transactionService.env }}
            {{- range $key, $value := .Values.transactionService.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.transactionService.resources | nindent 12 }}
          # See journey-service.yaml for why this needs a startupProbe: cold JVM start
          # (Spring context + Flyway + Hibernate + Kafka admin) has been observed taking
          # 77-90s on GKE Autopilot's default CPU request, well past the liveness
          # probe's old ~60s failure budget.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian.fullname" . }}-transaction-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: transaction-service
spec:
  type: {{ .Values.transactionService.service.type }}
  ports:
    - port: {{ .Values.transactionService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "meridian.selectorLabels" (dict "component" "transaction-service" "context" $) | nindent 4 }}
    app.kubernetes.io/component: transaction-service
{{- end }}
