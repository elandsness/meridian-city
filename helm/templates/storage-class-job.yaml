{{/*
Auto-configure storage classes for the detected cloud provider.

This Job runs once during installation to:
1. Detect the cloud provider (AWS, GCP, Azure)
2. Verify required CSI drivers are available
3. Create appropriate storage classes
4. Set them as default

This ensures Meridian City "just works" on EKS, GKE, and AKS without manual
storage class configuration. The Job is idempotent and safe to re-run.

The Job uses a small script in a ConfigMap to detect the provider via node labels
and create the appropriate storage classes.

For EKS:
- The EBS CSI driver is typically installed as an EKS managed addon
- If not installed, see: https://docs.aws.amazon.com/eks/latest/userguide/ebs-csi.html
- The deprecated in-tree provisioner (kubernetes.io/aws-ebs) was removed in K8s 1.28
- We use ebs.csi.aws.com (the correct, modern provisioner)
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "meridian.fullname" . }}-storage-class-config"
  namespace: {{ include "meridian.namespace" . }}
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/part-of: meridian-city-platform
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/version: {{ .Values.global.imageTag | quote }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
data:
  detect-provider.sh: |
    #!/bin/bash
    set -euo pipefail

    echo "Detecting cloud provider..."

    # Detect cloud provider by checking node labels
    PROVIDER="unknown"

    # Check for GCP (GKE)
    if kubectl get nodes -o jsonpath='{.items[0].metadata.labels.cloud\.google\.com/gke-nodepool}' 2>/dev/null | grep -q .; then
      PROVIDER="gcp"
      echo "Detected: Google Cloud Platform (GKE)"
    # Check for Azure (AKS)
    elif kubectl get nodes -o jsonpath='{.items[0].metadata.labels.failure-domain\.beta\.kubernetes\.io/zone}' 2>/dev/null | grep -q . || \
         kubectl get nodes -o jsonpath='{.items[0].metadata.labels.kubernetes\.io/azure-zone}' 2>/dev/null | grep -q .; then
      PROVIDER="azure"
      echo "Detected: Microsoft Azure (AKS)"
    # Check for AWS (EKS)
    elif kubectl get nodes -o jsonpath='{.items[0].metadata.labels.topology\.kubernetes\.io/zone}' 2>/dev/null | grep -qE '^[a-z]{2}-[a-z]+-[0-9]+$' || \
         kubectl get nodes -o jsonpath='{.items[0].spec.providerID}' 2>/dev/null | grep -qE '^aws://'; then
      PROVIDER="aws"
      echo "Detected: Amazon Web Services (EKS)"
    else
      echo "Could not detect cloud provider, defaulting to AWS (EKS)"
      PROVIDER="aws"
    fi

    echo "Using provider: $PROVIDER"

    # Verify required CSI drivers are available
    if [[ "$PROVIDER" == "aws" ]]; then
      echo "Verifying EBS CSI driver is available..."
      if ! kubectl get storageclass | grep -q ebs.csi.aws.com; then
        echo "ERROR: EBS CSI driver not found on this EKS cluster."
        echo ""
        echo "The EBS CSI driver is required for persistent volumes on EKS."
        echo "It is typically installed as an EKS managed addon."
        echo ""
        echo "To install it, run one of these commands:"
        echo ""
        echo "  # Option 1: Using eksctl (recommended)"
        echo "  eksctl create iamserviceaccount \\"
        echo "    --name ebs-csi-controller-sa \\"
        echo "    --namespace kube-system \\"
        echo "    --cluster $(kubectl config view --minify -o jsonpath='{.clusters[0].name}') \\"
        echo "    --role-name AmazonEKS_EBS_CSI_DriverRole \\"
        echo "    --attach-policy-arn arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicyV2 \\"
        echo "    --approve"
        echo ""
        echo "  # Option 2: Using AWS Console"
        echo "  https://docs.aws.amazon.com/eks/latest/userguide/managing-ebs-csi.html"
        echo ""
        echo "After installing the EBS CSI driver, redeploy Meridian City."
        echo ""
        echo "NOTE: The deprecated in-tree provisioner (kubernetes.io/aws-ebs)"
        echo "was removed in Kubernetes 1.28. You must use the EBS CSI driver."
        exit 1
      fi
      echo "EBS CSI driver verified."
    elif [[ "$PROVIDER" == "gcp" ]]; then
      echo "Verifying GCP PD CSI driver is available..."
      if ! kubectl get storageclass | grep -q pd.csi.storage.gke.io; then
        echo "ERROR: GCP PD CSI driver not found on this GKE cluster."
        echo "GKE includes the CSI driver by default. If you're seeing this,"
        echo "your cluster may have been configured without it."
        exit 1
      fi
      echo "GCP PD CSI driver verified."
    elif [[ "$PROVIDER" == "azure" ]]; then
      echo "Verifying Azure Disk CSI driver is available..."
      if ! kubectl get storageclass | grep -q disk.csi.azure.com; then
        echo "ERROR: Azure Disk CSI driver not found on this AKS cluster."
        echo "AKS includes the CSI driver by default. If you're seeing this,"
        echo "your cluster may have been configured without it."
        exit 1
      fi
      echo "Azure Disk CSI driver verified."
    fi

    # Create storage classes based on provider
    case "$PROVIDER" in
      aws)
        echo "Creating AWS storage classes..."
        # Create meridian-gp3 (default)
        kubectl create storageclass meridian-gp3 \
          --provider=ebs.csi.aws.com \
          --parameters='type=gp3,encrypted=true,kmsKeyId=alias/aws/ebs' \
          --reclaim-policy=Retain \
          --volume-binding-mode=WaitForFirstConsumer \
          --allow-volume-expansion \
          --annotate storageclass.kubernetes.io/is-default-class=true \
          --dry-run=client -o yaml | kubectl apply -f -

        # Create meridian-io2
        kubectl create storageclass meridian-io2 \
          --provider=ebs.csi.aws.com \
          --parameters='type=io2,encrypted=true,kmsKeyId=alias/aws/ebs,iops=3000' \
          --reclaim-policy=Retain \
          --volume-binding-mode=WaitForFirstConsumer \
          --allow-volume-expansion \
          --dry-run=client -o yaml | kubectl apply -f -

        echo "AWS storage classes created (meridian-gp3 set as default)"
        ;;
      gcp)
        echo "Creating GCP storage classes..."
        # Create meridian-standard (default)
        kubectl create storageclass meridian-standard \
          --provider=pd.csi.storage.gke.io \
          --parameters='type=pd-standard,encrypted=true' \
          --reclaim-policy=Retain \
          --volume-binding-mode=WaitForFirstConsumer \
          --allow-volume-expansion \
          --annotate storageclass.kubernetes.io/is-default-class=true \
          --dry-run=client -o yaml | kubectl apply -f -

        # Create meridian-premium
        kubectl create storageclass meridian-premium \
          --provider=pd.csi.storage.gke.io \
          --parameters='type=pd-ssd,encrypted=true' \
          --reclaim-policy=Retain \
          --volume-binding-mode=WaitForFirstConsumer \
          --allow-volume-expansion \
          --dry-run=client -o yaml | kubectl apply -f -

        echo "GCP storage classes created (meridian-standard set as default)"
        ;;
      azure)
        echo "Creating Azure storage classes..."
        # Create meridian-managed-premium (default)
        kubectl create storageclass meridian-managed-premium \
          --provider=disk.csi.azure.com \
          --parameters='skuName=StandardSSD_LRS,encrypted=true' \
          --reclaim-policy=Retain \
          --volume-binding-mode=WaitForFirstConsumer \
          --allow-volume-expansion \
          --annotate storageclass.kubernetes.io/is-default-class=true \
          --dry-run=client -o yaml | kubectl apply -f -

        # Create meridian-managed-ssd
        kubectl create storageclass meridian-managed-ssd \
          --provider=disk.csi.azure.com \
          --parameters='skuName=Premium_LRS,encrypted=true' \
          --reclaim-policy=Retain \
          --volume-binding-mode=WaitForFirstConsumer \
          --allow-volume-expansion \
          --dry-run=client -o yaml | kubectl apply -f -

        echo "Azure storage classes created (meridian-managed-premium set as default)"
        ;;
      *)
        echo "ERROR: Unknown provider '$PROVIDER'"
        exit 1
        ;;
    esac

    echo "Storage class configuration complete."
    echo "Default storage class: meridian-<provider>-<type>"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "meridian.fullname" . }}-storage-class-setup"
  namespace: {{ include "meridian.namespace" . }}
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/part-of: meridian-city-platform
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/version: {{ .Values.global.imageTag | quote }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
        app.kubernetes.io/part-of: meridian-city-platform
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        app.kubernetes.io/version: {{ .Values.global.imageTag | quote }}
        app.kubernetes.io/name: storage-class-setup
    spec:
      restartPolicy: Never
      serviceAccountName: "{{ include "meridian.fullname" . }}-storage-class-admin"
      containers:
        - name: setup-storage
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              /etc/scripts/detect-provider.sh
          volumeMounts:
            - name: scripts
              mountPath: /etc/scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: "{{ include "meridian.fullname" . }}-storage-class-config"
            defaultMode: 0755
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ include "meridian.fullname" . }}-storage-class-admin"
  namespace: {{ include "meridian.namespace" . }}
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/part-of: meridian-city-platform
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/version: {{ .Values.global.imageTag | quote }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "{{ include "meridian.fullname" . }}-storage-class-admin"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/part-of: meridian-city-platform
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/version: {{ .Values.global.imageTag | quote }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": hook-succeeded
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "{{ include "meridian.fullname" . }}-storage-class-admin"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/part-of: meridian-city-platform
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/version: {{ .Values.global.imageTag | quote }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: "{{ include "meridian.fullname" . }}-storage-class-admin"
subjects:
  - kind: ServiceAccount
    name: "{{ include "meridian.fullname" . }}-storage-class-admin"
    namespace: {{ include "meridian.namespace" . }}