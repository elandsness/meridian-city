{{- if .Values.newsTickerService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian.fullname" . }}-news-ticker-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: news-ticker-service
spec:
  replicas: {{ .Values.newsTickerService.replicaCount }}
  selector:
    matchLabels:
      {{- include "meridian.selectorLabels" (dict "component" "news-ticker-service" "context" $) | nindent 6 }}
      app.kubernetes.io/component: news-ticker-service
  template:
    metadata:
      labels:
        {{- include "meridian.selectorLabels" (dict "component" "news-ticker-service" "context" $) | nindent 8 }}
        app.kubernetes.io/component: news-ticker-service
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: news-ticker-service
          image: {{ include "meridian.image" (dict "repository" .Values.newsTickerService.image.repository "tag" .Values.newsTickerService.image.tag "context" $) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8095
          env:
            - name: PORT
              value: "8095"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "meridian.kafkaBootstrap" . }}
            {{- if .Values.newsTickerService.env }}
            {{- range $key, $value := .Values.newsTickerService.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/news
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/news
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.newsTickerService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian.fullname" . }}-news-ticker-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: news-ticker-service
spec:
  type: {{ .Values.newsTickerService.service.type }}
  ports:
    - port: {{ .Values.newsTickerService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "meridian.selectorLabels" (dict "component" "news-ticker-service" "context" $) | nindent 4 }}
    app.kubernetes.io/component: news-ticker-service
{{- end }}
