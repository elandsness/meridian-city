# This Job generates a custom branding logo based on the industry config.
# Uses bitnami/kubectl (same image storage-class-job.yaml already relies on)
# instead of a bespoke "provisioner" image that was never actually built by
# CI -- the script only needs bash + kubectl, both already on that image.
#
# pre-install,pre-upgrade (NOT post-): ops-dashboard.yaml/public-portal.yaml
# mount the generated ConfigMap with `subPath`, which Kubernetes never live-
# updates in a running pod -- content is frozen at whatever it was when that
# container started, permanently, regardless of how many times this Job
# re-runs afterward. Running as a pre-hook means the ConfigMap holds the
# CORRECT content before the Deployments are even applied, so a pod that gets
# (re)created this same upgrade (see checksum/branding below) picks up
# accurate content at creation time instead of being one Job-run behind.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "meridian.fullname" . }}-branding-provisioner-script
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  provision-branding.sh: |
{{ .Files.Get "files/provision-branding.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "meridian.fullname" . }}-branding-provisioner
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      serviceAccountName: {{ include "meridian.fullname" . }}-provisioner
      restartPolicy: OnFailure
      containers:
        - name: provisioner
          image: bitnami/kubectl:latest
          env:
            - name: BRANDING_NAME
              value: {{ .Values.industry.company.name | quote }}
            - name: BRANDING_COLOR
              value: {{ .Values.industry.theme.colors.brand | quote }}
            - name: BRANDING_ACCENT
              value: {{ .Values.industry.theme.colors.accent | quote }}
            - name: BRANDING_ICON
              value: {{ (.Values.industry.theme.icon | default "") | quote }}
            - name: BRANDING_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: BRANDING_CONFIGMAP_NAME
              value: {{ include "meridian.fullname" . }}-branding
          command: ["/bin/bash", "/scripts/provision-branding.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: {{ include "meridian.fullname" . }}-branding-provisioner-script
            defaultMode: 0755
---
# Namespace-scoped: the provisioner only ever touches a ConfigMap in its own
# release namespace (multi-tenancy isolation -- no cluster-wide access needed,
# unlike storage-class-job.yaml's ClusterRole).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "meridian.fullname" . }}-provisioner
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "meridian.fullname" . }}-provisioner
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "meridian.fullname" . }}-provisioner
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "meridian.fullname" . }}-provisioner
subjects:
  - kind: ServiceAccount
    name: {{ include "meridian.fullname" . }}-provisioner
    namespace: {{ .Release.Namespace }}
