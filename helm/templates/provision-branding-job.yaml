# This Job generates a custom branding logo based on the industry config.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "meridian.fullname" . }}-branding-provisioner
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      serviceAccountName: {{ include "meridian.fullname" . }}-provisioner
      restartPolicy: OnFailure
      containers:
        - name: provisioner
          image: {{ .Values.global.imagePrefix }}/provisioner:latest
          env:
            - name: BRANDING_NAME
              value: {{ .Values.industry.company.name | quote }}
            - name: BRANDING_COLOR
              value: {{ .Values.industry.theme.colors.brand | quote }}
            - name: BRANDING_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: BRANDING_HASH
              value: {{ .Values.global.instanceHash | quote }}
          command: ["python3", "/scripts/provision-branding.py"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: {{ include "meridian.fullname" . }}-scripts
