              value: "true"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "meridian.kafkaBootstrap" . | quote }}
            {{- include "meridian.commonEnv" (dict "context" $) | nindent 12 }}
            {{- with .Values.opsEntityService.env }}
            {{- include "meridian.extraEnv" . | nindent 12 }}
