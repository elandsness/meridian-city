          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8094
            initialDelaySeconds: 90
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8094
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            {{- toYaml .Values.opsEntityService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
