{{- if .Values.iotService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian.fullname" . }}-iot-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: iot-service
spec:
  replicas: {{ .Values.iotService.replicaCount }}
  selector:
    matchLabels:
      {{- include "meridian.selectorLabels" (dict "component" "iot-service" "context" $) | nindent 6 }}
      app.kubernetes.io/component: iot-service
  template:
    metadata:
      labels:
        {{- include "meridian.selectorLabels" (dict "component" "iot-service" "context" $) | nindent 8 }}
        app.kubernetes.io/component: iot-service
      annotations:
        sidecar.istio.io/inject: "false"
        instrumentation.opentelemetry.io/inject-java: "false"
    spec:
      serviceAccountName: {{ include "meridian.fullname" . }}-iot-service
      containers:
        - name: iot-service
          image: {{ include "meridian.image" (dict "repository" .Values.iotService.image.repository "tag" .Values.iotService.image.tag "context" $) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: http
              containerPort: 8086
          env:
            - name: DB_HOST
              value: {{ include "meridian.dbRwService" . }}
            - name: DB_NAME
              value: meridian
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian.fullname" . }}-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian.fullname" . }}-db-credentials
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "meridian.kafkaBootstrap" . }}
            - name: SIMULATOR_ENABLED
              value: {{ .Values.iotService.simulator.enabled | quote }}
            - name: SIMULATOR_FLEET_VEHICLES_COUNT
              value: {{ .Values.iotService.simulator.fleet.vehicles.count | quote }}
            - name: SIMULATOR_FLEET_BUILDINGS_COUNT
              value: {{ .Values.iotService.simulator.fleet.buildings.count | quote }}
            - name: SIMULATOR_FLEET_MACHINES_COUNT
              value: {{ .Values.iotService.simulator.fleet.machines.count | quote }}
            {{- if .Values.iotService.env }}
            {{- range $key, $value := .Values.iotService.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.iotService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian.fullname" . }}-iot-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: iot-service
spec:
  type: {{ .Values.iotService.service.type }}
  ports:
    - port: 4317
      targetPort: otlp-grpc
      protocol: TCP
      name: otlp-grpc
    - port: 4318
      targetPort: otlp-http
      protocol: TCP
      name: otlp-http
    - port: {{ .Values.iotService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "meridian.selectorLabels" (dict "component" "iot-service" "context" $) | nindent 4 }}
    app.kubernetes.io/component: iot-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "meridian.fullname" . }}-iot-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "meridian.fullname" . }}-iot-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "meridian.fullname" . }}-iot-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "meridian.fullname" . }}-iot-service
subjects:
  - kind: ServiceAccount
    name: {{ include "meridian.fullname" . }}-iot-service
    namespace: {{ include "meridian.namespace" . }}
{{- end }}
