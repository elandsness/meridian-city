{{- if .Values.workflowService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian.fullname" . }}-workflow-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: workflow-service
spec:
  replicas: {{ .Values.workflowService.replicaCount }}
  selector:
    matchLabels:
      {{- include "meridian.selectorLabels" (dict "component" "workflow-service" "context" $) | nindent 6 }}
      app.kubernetes.io/component: workflow-service
  template:
    metadata:
      labels:
        {{- include "meridian.selectorLabels" (dict "component" "workflow-service" "context" $) | nindent 8 }}
        app.kubernetes.io/component: workflow-service
    spec:
      containers:
        - name: workflow-service
          image: "{{ .Values.workflowService.image.repository }}:{{ .Values.workflowService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://{{ include "meridian.dbRwService" . }}:5432/meridian
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian.fullname" . }}-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian.fullname" . }}-db-credentials
                  key: password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "meridian.kafkaBootstrap" . }}
            {{- if .Values.workflowService.env }}
            {{- range $key, $value := .Values.workflowService.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.workflowService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian.fullname" . }}-workflow-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: workflow-service
spec:
  type: {{ .Values.workflowService.service.type }}
  ports:
    - port: {{ .Values.workflowService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "meridian.selectorLabels" (dict "component" "workflow-service" "context" $) | nindent 4 }}
    app.kubernetes.io/component: workflow-service
{{- end }}
