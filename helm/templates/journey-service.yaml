{{- if .Values.journeyService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian.fullname" . }}-journey-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: journey-service
spec:
  replicas: {{ .Values.journeyService.replicaCount }}
  selector:
    matchLabels:
      {{- include "meridian.selectorLabels" (dict "component" "journey-service" "context" $) | nindent 6 }}
      app.kubernetes.io/component: journey-service
  template:
    metadata:
      labels:
        {{- include "meridian.selectorLabels" (dict "component" "journey-service" "context" $) | nindent 8 }}
        app.kubernetes.io/component: journey-service
    spec:
      containers:
        - name: journey-service
          image: "{{ .Values.journeyService.image.repository }}:{{ .Values.journeyService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8093
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://{{ include "meridian.dbRwService" . }}:5432/meridian
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian.fullname" . }}-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian.fullname" . }}-db-credentials
                  key: password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "meridian.kafkaBootstrap" . }}
            - name: JOURNEY_LIFECYCLE_ENABLED
              value: {{ .Values.journeyService.lifecycle.enabled | quote }}
            - name: JOURNEY_LIFECYCLE_MIN_SECONDS
              value: {{ .Values.journeyService.lifecycle.minSeconds | quote }}
            - name: JOURNEY_LIFECYCLE_MAX_SECONDS
              value: {{ .Values.journeyService.lifecycle.maxSeconds | quote }}
            - name: JOURNEY_GENERATOR_MAX_ACTIVE
              value: {{ .Values.journeyService.generator.maxActive | quote }}
            - name: PASSENGER_GENERATOR_MAX_ACTIVE
              value: {{ .Values.journeyService.generator.passengerMaxActive | quote }}
            - name: PASSENGER_GENERATOR_BAG_PROBABILITY
              value: {{ .Values.journeyService.generator.bagProbability | quote }}
            {{- if .Values.journeyService.env }}
            {{- range $key, $value := .Values.journeyService.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.journeyService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian.fullname" . }}-journey-service
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: journey-service
spec:
  type: {{ .Values.journeyService.service.type }}
  ports:
    - port: {{ .Values.journeyService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "meridian.selectorLabels" (dict "component" "journey-service" "context" $) | nindent 4 }}
    app.kubernetes.io/component: journey-service
{{- end }}
