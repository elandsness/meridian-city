# =============================================================================
# Meridian Hospital — industry config overlay
# =============================================================================
# Layer this over the base chart + your secrets to deploy a hospital-branded
# instance:
#   ./scripts/deploy.sh install -f helm/values-custom.yaml -f helm/values-hospital.yaml
#
# Only the `industry` block is overridden — it re-skins the EXISTING screens
# (name, palette, logo, terminology, screen set, AI persona). Hospital-matched demo
# DATA (traffic-bot/seed) and Dynatrace naming/flows are separate follow-on chunks;
# until those land, the backend still emits city-flavoured data.
# -----------------------------------------------------------------------------
industry:
  version: 1
  id: hospital
  company:
    name: "Meridian Hospital"
    short: "Meridian"
    tagline: "Care that heals."
    assistant:
      name: "Dr. Maya"
      persona: "the Meridian Hospital virtual assistant"
      supportPhone: "1-555-HOSP-MERID (1-555-467-76374)"
      systemPrompt: |-
        You are Dr. Maya, the official virtual assistant for Meridian Hospital — a real,
        busy general hospital. Always respond as though Meridian Hospital genuinely exists
        and you are its assistant. Never say you are a generic AI model or that the hospital
        is fictional, and never break character.

        You help patients and visitors with:
        - Finding departments, doctors, and facilities.
        - Scheduling appointments and checking wait times.
        - Reporting a concern about care or facilities.
        - Checking the status of a submitted request (by request ID, e.g. req-00123).

        If a patient needs to reach a person, give the Meridian Hospital help line:
        1-555-HOSP-MERID (1-555-467-76374), available 24/7, or direct them to file a
        request in the app.

        Be compassionate, clear, and professional. Acknowledge the patient's concern before
        providing information. If a request ID is mentioned, use the context below to
        give a specific update.
  theme:
    colors:
      brand: "#0D9488"
      brandDeep: "#0F766E"
      brandSoft: "#14B8A6"
      brandTint: "#F0FDFA"
      accent: "#F59E0B"
      accentSoft: "#FCD34D"
      accentInk: "#451A03"
    logo: "/meridian-hospital-logo.svg"
    favicon: "/meridian-hospital-logo.svg"
  terminology:
    customer: "Patient"
    customerPlural: "Patients"
    request: "Care request"
    requestPlural: "Care requests"
    incident: "Safety incident"
    incidentPlural: "Safety incidents"
    workOrder: "Work order"
    asset: "Medical equipment"
    assetPlural: "Medical equipment"
  screens:
    # store + billing intentionally omitted -> disabled for the hospital
    public:
      - home
      - { id: my-journey, label: "My Care Journey" }
      - { id: service-requests, label: "Care requests" }
      - messages
    ops:
      - overview
      - { id: patient-board, label: "Patient Board" }
      - { id: beds, label: "Bed Management" }
      - { id: requests, label: "Care queue" }
      - { id: iot, label: "Medical equipment" }
      - { id: incidents, label: "Safety incidents" }
      - { id: analytics, label: "Quality metrics" }
      - demo-control
  # Home-page modules for the patient portal: patient board, bed map, care tracker.
  home:
    public:
      - patient-status
      - bed-map
      - my-journey
      - quick-actions
    ops:
      - patient-summary
      - ops-overview
  # Backend-only demo data + dispatch routing (delivered to traffic-bot +
  # service-dispatch via env; never sent to the browser config.json).
  data:
    zones:
      - emergency
      - ICU
      - maternity
      - pediatrics
      - outpatient
      - surgical
      - radiology
      - pharmacy
    requestTemplates:
      - { category: emergency,      title: "Ambulance bay door stuck open",            description: "The automatic door at the ambulance bay is stuck open and won't close." }
      - { category: emergency,      title: "ER triage board frozen",                  description: "The electronic triage board in the ER is frozen on a patient from 2 hours ago." }
      - { category: outpatient,     title: "Pharmacy window 3 printer offline",       description: "The prescription printer at pharmacy window 3 is offline and not printing labels." }
      - { category: outpatient,     title: "Lab result portal not updating",          description: "The patient portal is not showing lab results that were finalized this morning." }
      - { category: surgical,       title: "OR 4 scrub sink faucet leaking",          description: "The scrub sink faucet in Operating Room 4 is leaking and wasting water." }
      - { category: surgical,       title: "Sterilizer alarm at central supply",      description: "The autoclave in central supply is beeping with a sterilization failure alarm." }
      - { category: radiology,      title: "CT scanner 2 warm-up timeout",            description: "CT Scanner 2 keeps timing out during warm-up and won't accept patients." }
      - { category: radiology,      title: "MRI cooling system fault",                description: "The MRI cryogen cooling system is reporting a low-helium fault." }
      - { category: facilities,     title: "ICU HVAC too warm",                       description: "The HVAC in the ICU is not keeping up; nurses reporting patients complaining about heat." }
      - { category: facilities,     title: "Elevator 2 out of service",               description: "Elevator 2 between B1 and 2 is out of service, forcing wheelchair users to detour." }
      - { category: facilities,      title: "Parking structure P2 gate arm broken",    description: "The exit gate arm in parking structure P2 is stuck down, blocking cars." }
      - { category: grounds,         title: "Helipad floodlight out",                  description: "One of the helipad floodlights is out, reducing night landing visibility." }
    chatQuestions:
      - "Where is the nearest pharmacy?"
      - "How do I find my doctor's office?"
      - "What are the visiting hours?"
      - "Where do I park for emergency?"
      - "How long is the wait in the ER?"
      - "Where is the maternity ward?"
      - "How do I get my lab results?"
      - "Where is the patient bookstore?"
      - "How do I contact my doctor?"
      - "Where is the helipad?"
      - "How do I request a second opinion?"
      - "Where is the nearest wheelchair station?"
  routing:
    emergency: "Emergency Department"
    ICU: "Intensive Care Unit"
    outpatient: "Outpatient Services"
    surgical: "Surgical Services"
    radiology: "Diagnostic Imaging"
    facilities: "Facilities Management"
    grounds: "Grounds & Helipad"
  # Dynatrace reskin (Path A): rename the service map (OneAgent services; each rule scoped
  # to this instance's namespace) and the Business Flow titles. OTel services (ai-service,
  # iot-*) are renamed via OTEL_SERVICE_NAME separately, not here.
  dynatrace:
    serviceNames:
      citizen-service: "Patient Services"
      service-dispatch: "Care Coordination"
      city-operations: "Facilities Management"
      api-gateway: "Hospital API Gateway"
      notification-service: "Patient Notifications"
      commerce-service: "Hospital Retail"
      billing-service: "Hospital Billing"
      demo-control-api: "Demo Control"
    flowLabels:
      service-request: "Care Request Lifecycle"
      account-creation: "Patient Registration"
      iot-incident: "Medical Equipment Incident Resolution"
      purchase: "Hospital Retail Purchase"
      tax-payment: "Hospital Fee Payment"
    # Active Business Flows for the hospital: drop the city store/tax funnels and add the
    # two hospital hero flows (both defined in provision-dynatrace-business-config.py).
    flows:
      - service-request
      - account-creation
      - iot-incident
      - patient-journey
      - treatment-lifecycle
