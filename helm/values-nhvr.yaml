industry:
  version: 1
  id: "nhvr-compliance"
  primaryFlow: "nhvr_access_permit_journey"
  company:
    name: "National Heavy Vehicle Regulator"
    short: "NHVR"
    tagline: "Safe, efficient, and productive heavy vehicle road transport across Australia"
  theme:
    colors:
      brand: "#002B49"  # NHVR Deep Navy
      accent: "#FFAE00" # High-Vis Safety Gold
    icon: "🚛"
    # logo/favicon intentionally omitted -- no real asset to point at. The
    # branding-provisioner Job auto-generates an on-brand logo from icon +
    # colors.brand at deploy time instead of 404ing on a path that doesn't exist.

  # ----------------------------------------------------------------------------
  # TERMINOLOGY TRANSLATIONS
  # ----------------------------------------------------------------------------
  terminology:
    customer: "Heavy Vehicle Operator"
    customers: "Heavy Vehicle Operators"
    service_request: "Access Permit Application"
    service_requests: "Access Permit Applications"
    requestCategories:
      - "class1_osom"
      - "class2_bdouble"
      - "pbs_high_productivity"
      - "fatigue_exemption"
      - "other"

  # ----------------------------------------------------------------------------
  # ENTITY STATE MACHINES & CORRELATION ENVELOPE
  # ----------------------------------------------------------------------------
  entities:
    # Clean up and completely disable City default assets to prevent data leak
    citizen: null
    service_request: null
    bill: null
    cart: null
    incident: null
    work_order: null

    # 1. Customer-Facing Entity: Access Permit
    permit:
      displayName: "Access Permit Application"
      displayNamePlural: "Access Permit Applications"
      idPrefix: "prm"
      domain: customer
      fields:
        permit_number:
          type: string
          required: true
        operator_id:
          type: string
          required: true
        operator_name:
          type: string
          required: true
        vehicle_class:
          type: enum
          required: true
          values: ["Class 1 OSOM", "Class 2 B-Double", "Type 1 Road Train", "PBS High Productivity"]
        gross_mass_tonnes:
          type: number
          required: true
        jurisdiction:
          type: enum
          required: true
          values: ["QLD", "NSW", "VIC", "SA", "TAS", "ACT"]
        route_name:
          type: string
          required: true
      initial: lodged
      states:
        lodged:
          label: "Lodged in NHVR Go"
          tone: slate
          glyph: "📝"
        under_review:
          label: "Regulatory Assessment"
          tone: blue
          glyph: "🔎"
        council_review_delayed:
          label: "Road Manager Consent Delayed"
          tone: orange
          isError: true
          notify: true
          glyph: "⏳"
        road_manager_consented:
          label: "Road Managers Consented"
          tone: blue
          isKpi: true
          glyph: "🏛️"
        access_refused:
          label: "Access Refused (Bridge/Road Rating)"
          tone: red
          terminal: true
          isError: true
          glyph: "🚫"
        permit_issued:
          label: "Access Permit Issued"
          tone: green
          isKpi: true
          notify: true
          glyph: "✅"
        journey_active:
          label: "Journey In-Transit"
          tone: blue
          glyph: "🚛"
        journey_completed:
          label: "Transit Completed"
          tone: green
          terminal: true
          isKpi: true
          glyph: "🏁"
      transitions:
        - from: lodged
          to: under_review
          label: "Validate Vehicle Configuration"
          userTriggerable: false
          timer: { minSeconds: 15, maxSeconds: 30 }
          signal:
            eventType: "permit.validation_completed"
            correlationId: "permit_number"
        # Each outcome below gets its OWN faultGate name -- the engine stores one
        # shared {enabled, rate} PER NAME, not per transition, so two transitions
        # sharing a name silently collapse onto whichever one seeds it first.
        - from: under_review
          to: road_manager_consented
          label: "Route Consent Granted"
          userTriggerable: false
          timer: { minSeconds: 30, maxSeconds: 60 }
          when: { faultGate: "permit-consent-granted", probability: 0.75 }  # healthy-path baseline
          signal:
            eventType: "permit.council_consented"
            correlationId: "permit_number"
        - from: under_review
          to: council_review_delayed
          label: "Council Request for Extension (EOT)"
          userTriggerable: false
          timer: { minSeconds: 20, maxSeconds: 40 }
          when: { faultGate: "council-delay-spike", probability: 0.15 }  # Demo Control lever: raise to show a delay spike
          signal:
            eventType: "permit.council_eot_requested"
            correlationId: "permit_number"
        - from: under_review
          to: access_refused
          label: "Reject (HVNL Safety Standards)"
          userTriggerable: false
          timer: { minSeconds: 20, maxSeconds: 45 }
          when: { faultGate: "permit-access-refused", probability: 0.05 }
          signal:
            eventType: "permit.access_refused"
            correlationId: "permit_number"
        - from: council_review_delayed
          to: road_manager_consented
          label: "Escalated Consent Resolved"
          userTriggerable: true
          signal:
            eventType: "permit.council_delay_resolved"
            correlationId: "permit_number"
        - from: road_manager_consented
          to: permit_issued
          label: "Approve & Deliver Permit"
          userTriggerable: false
          timer: { minSeconds: 15, maxSeconds: 30 }
          signal:
            eventType: "permit.issued"
            correlationId: "permit_number"
        - from: permit_issued
          to: journey_active
          label: "Log GPS Journey Start"
          userTriggerable: false
          timer: { minSeconds: 20, maxSeconds: 40 }
          signal:
            eventType: "permit.journey_started"
            correlationId: "permit_number"
          effects:
            - action: "spawnLinked"
              entityType: "intercept"
              fields:
                permit_number: { from: "permit_number" }
                inspection_station: "Marulan Heavy Vehicle Safety Station"
                officer_callsign: "SCO-Beta"
        - from: journey_active
          to: journey_completed
          label: "Log Safe Transit Finish"
          userTriggerable: false
          timer: { minSeconds: 60, maxSeconds: 120 }
          signal:
            eventType: "permit.journey_completed"
            correlationId: "permit_number"
      computed:
        position:
          type: point2d
          interpolation: linear
          waypoints:
            lodged: [{ x: 100, "y": 150 }]
            under_review: [{ x: 300, "y": 150 }]
            council_review_delayed: [{ x: 450, "y": 50 }]
            access_refused: [{ x: 450, "y": 250 }]
            road_manager_consented: [{ x: 550, "y": 150 }]
            permit_issued: [{ x: 700, "y": 150 }]
            journey_active: [{ x: 850, "y": 150 }]
            journey_completed: [{ x: 1000, "y": 150 }]
      generator:
        strategy: simpleSteadyState
        intervalMs: 15000
        maxActive: 10
        ownerField: "operator_id"
        fields:
          permit_number:
            values: ["PRM-2026-9041", "PRM-2026-3829", "PRM-2026-5501", "PRM-2026-1172", "PRM-2026-7731"]
          operator_id:
            values: ["OP-10432", "OP-20876", "OP-30198", "OP-40567", "OP-50321"]
          operator_name:
            faker: "fullName"
          vehicle_class:
            values: ["Class 1 OSOM", "Class 2 B-Double", "Type 1 Road Train", "PBS High Productivity"]
          gross_mass_tonnes:
            min: 42
            max: 110
          jurisdiction:
            values: ["QLD", "NSW", "VIC", "SA", "TAS", "ACT"]
          route_name:
            values: ["Hume Highway Freight Corridor", "Pacific Highway Route 1", "Bruce Highway Corridor", "Sturt Highway Link"]

    # 2. Operations-Facing Entity: Roadside Compliance Intercept
    intercept:
      displayName: "Safety Intercept"
      displayNamePlural: "Safety Intercepts"
      idPrefix: "itc"
      domain: ops
      fields:
        intercept_id:
          type: string
          required: true
        permit_number:
          type: ref
          required: true
          entity: permit
        inspection_station:
          type: string
          required: true
        officer_callsign:
          type: string
          required: true
          default: "SCO-Alpha"
      initial: flagged_by_anpr
      states:
        flagged_by_anpr:
          label: "Targeted by Camera Network"
          tone: slate
          glyph: "📷"
        weighbridge_audited:
          label: "Weighbridge & Log Evaluated"
          tone: blue
          glyph: "⚖️"
        defect_notice_issued:
          label: "Defect Notice Issued (Breach)"
          tone: red
          terminal: true
          isError: true
          notify: true
          glyph: "🚨"
        cleared_safe:
          label: "Cleared Safe & Released"
          tone: green
          terminal: true
          isKpi: true
          glyph: "🛡️"
      transitions:
        - from: flagged_by_anpr
          to: weighbridge_audited
          label: "Direct Heavy Vehicle to Safety Bay"
          userTriggerable: false
          timer: { minSeconds: 15, maxSeconds: 30 }
          signal:
            eventType: "intercept.bay_arrival"
            correlationId: "permit_number"
        - from: weighbridge_audited
          to: cleared_safe
          label: "Authorize Re-entry to Highway"
          userTriggerable: false
          timer: { minSeconds: 20, maxSeconds: 40 }
          when: { faultGate: "intercept-cleared", probability: 0.85 }  # healthy-path baseline
          signal:
            eventType: "intercept.vehicle_cleared"
            correlationId: "permit_number"
        - from: weighbridge_audited
          to: defect_notice_issued
          label: "Record Major HVNL Breach"
          userTriggerable: false
          timer: { minSeconds: 15, maxSeconds: 30 }
          when: { faultGate: "roadside-breach-surge", probability: 0.15 }  # Demo Control lever: raise to show a breach surge
          signal:
            eventType: "intercept.breach_issued"
            correlationId: "permit_number"
        - from: defect_notice_issued
          to: cleared_safe
          label: "Rectify & Release"
          userTriggerable: true
          signal:
            eventType: "intercept.rectified_release"
            correlationId: "permit_number"
      computed:
        position:
          type: point2d
          interpolation: linear
          waypoints:
            flagged_by_anpr: [{ x: 300, "y": 350 }]
            weighbridge_audited: [{ x: 550, "y": 350 }]
            defect_notice_issued: [{ x: 750, "y": 450 }]
            cleared_safe: [{ x: 750, "y": 350 }]
      generator:
        strategy: simpleSteadyState
        intervalMs: 20000
        maxActive: 5
        fields:
          intercept_id:
            values: ["ITC-9902", "ITC-1104", "ITC-3561", "ITC-8812", "ITC-5021"]
          inspection_station:
            values: ["Marulan Heavy Vehicle Safety Station", "Mt White Checking Station", "Ballimore Safety Hub"]
          officer_callsign:
            values: ["SCO-Alpha", "SCO-Gamma", "SCO-Mobile-7", "SCO-Pacific"]

  # Prevent City IoT devices from leaking into NHVR dashboards
  iot:
    enabled: false

  # ----------------------------------------------------------------------------
  # FRONTEND SCALABILITY & PUBLIC PORTAL SCREENS
  # ----------------------------------------------------------------------------
  screens:
    public:
      - id: "home"
      - id: "service-requests"
      - id: "active-permits"
        template: "entity-journey"
        entityType: "permit"
        ownerField: "operator_id"
        label: "My Active Permit Applications"
      - id: "permit-tracker-grid"
        template: "entity-list"
        entityType: "permit"
        label: "Live National Assessment Queue"
        fields: ["permit_number", "operator_name", "vehicle_class", "gross_mass_tonnes", "jurisdiction", "route_name"]

  home:
    public:
      - id: "nhvr-hero"
        template: "welcome-hero"
        position: "full"
      - id: "nhvr-ticker"
        template: "ticker"
        position: "full"
        height: "slim"
        label: "🚚 NHVR NATIONAL SAFETY & ACCESS FEED"
        items:
          - "🚚 National Service Transition: ACT and NSW regulatory compliance operations fully migrated to NHVR central systems."
          - "⚠️ Driver fatigue management reminder: additional rest stops added along the Hume Highway freight corridor."
          - "⚖️ Automated Weigh-in-Motion (WIM) sensors deployed on Hume Highway freight corridor at Marulan."
          - "🚨 High Winds warning on Pacific Highway near Chinderah; Class 1 OSOM transporters advised to exercise caution."
          - "🏛️ 14 local councils pre-approve automated B-Double access routes to reduce administrative application latency."
          - "📋 Electronic Work Diary (EWD) system update version 4.5.1 certified under national Heavy Vehicle National Law."
          - "🚧 Mt White Safety Station conducting safety campaign targeting load restraint enforcement."
      - id: "permit-overview"
        template: "my-journey"
        entityType: "permit"
        label: "My Permit Portfolio"
        position: "main"
      - id: "nhvr-quick-links"
        template: "quick-actions"
        label: "Industry Tools"
        position: "main"
        links:
          - { label: "National Network Map", url: "https://maps.nhvr.gov.au/", icon: "🗺️" }
          - { label: "PBS Approvals", url: "https://www.nhvr.gov.au/road-access/performance-based-standards", icon: "📏" }
          - { label: "Accreditation Scheme", url: "https://www.nhvr.gov.au/safety-accreditation-compliance/national-heavy-vehicle-accreditation-scheme", icon: "📜" }
          - { label: "Vehicle Standards", url: "https://www.nhvr.gov.au/safety-accreditation-compliance/vehicle-standards-and-modifications", icon: "🛠️" }

  # ----------------------------------------------------------------------------
  # DEMO DATA & ROUTING
  # ----------------------------------------------------------------------------
  data:
    zones: ["hume_corridor", "pacific_corridor", "bruce_corridor", "sturt_corridor"]
    requestTemplates:
      - { category: "class1_osom", title: "Class 1 OSOM Access Permit Application", description: "Oversize/overmass access permit request." }
      - { category: "class2_bdouble", title: "Class 2 B-Double / Road Train Notice Exemption", description: "B-Double or road train network access." }
      - { category: "pbs_high_productivity", title: "PBS High Productivity Vehicle Approval", description: "Performance Based Standards vehicle combination approval." }
      - { category: "fatigue_exemption", title: "Driver Fatigue Exemption Request", description: "Electronic Work Diary / fatigue management exemption." }
    chatQuestions:
      - "How long does a Class 1 OSOM permit take to process?"
      - "What happens if a road manager doesn't respond to a consent request?"
      - "Where are the active Weigh-in-Motion safety stations?"

  routing:
    class1_osom: "Heavy Vehicle Access Assessment Team"
    class2_bdouble: "National Network Road Access Unit"
    pbs_high_productivity: "Performance Based Standards Certification Panel"
    fatigue_exemption: "Driver Safety & Fatigue Assurance Division"
    other: "General Support"

  dynatrace:
    serviceNames:
      "customer-entity-service": "NHVR Go Portal"
      "ops-entity-service": "Roadside Compliance Ops"
      "api-gateway": "NHVR Gateway"
      "notification-service": "Operator Alerts"
    flowLabels:
      "permit": "Access Permit Journey"
      "intercept": "Roadside Safety Intercept"
    flows:
      - "permit"
      - "intercept"
