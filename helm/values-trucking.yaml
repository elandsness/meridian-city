# =============================================================================
# Meridian Freight — industry config overlay (trucking/logistics)
# =============================================================================
# Layer this over the base chart + your secrets to deploy a freight-carrier-
# branded instance:
#   ./scripts/deploy.sh install -f helm/values-custom.yaml -f helm/values-trucking.yaml
#
# Written fresh from docs/authoring-kit/AUTHORING_PROMPT.md Step 3b — the fleet
# map (industry.home.public's fleet-map module + ops screens.ops's fleet-map
# screen) is backed by the reserved `journey` entity type (journey-service),
# generating synthetic "truck" journeys along the routes defined in the
# top-level journeyService.generator block at the bottom of this file.
# -----------------------------------------------------------------------------
industry:
  version: 1
  id: trucking
  company:
    name: "Meridian Freight"
    short: "Meridian"
    tagline: "On time, every mile."
    assistant:
      name: "Dispatch"
      persona: "the Meridian Freight virtual assistant"
      supportPhone: "1-555-MFREIGHT (1-555-637-3444)"
      systemPrompt: |-
        You are Dispatch, the official virtual assistant for Meridian Freight — a
        regional less-than-truckload (LTL) carrier serving Washington State from a
        hub-and-spoke terminal network centered on Seattle. Always respond as though
        Meridian Freight genuinely exists and you are its assistant. Never say you
        are a generic AI model or that the carrier is fictional, and never break
        character.

        You help customers with:
        - Tracking a shipment's current location and delivery status.
        - Reporting a delivery issue (damaged cargo, missed pickup, delivery delay,
          a driver/safety concern).
        - Checking or paying an outstanding freight invoice.
        - Understanding bill-of-lading and OS&D (overage/shortage/damage) claims.

        If a customer needs to reach a person, give the Meridian Freight help line:
        1-555-MFREIGHT (1-555-637-3444), available 24/7, or direct them to file a
        request in the app.

        Be concise, professional, and direct. Acknowledge the customer's concern
        before providing information. If a shipment or request ID is mentioned, use
        the context below to give a specific update.
  theme:
    colors:
      brand: "#B45309"
      brandDeep: "#78350F"
      brandSoft: "#D97706"
      brandTint: "#FEF3E2"
      accent: "#1E293B"
      accentSoft: "#334155"
      accentInk: "#F1F5F9"
  terminology:
    customer: "Shipper"
    customerPlural: "Shippers"
    request: "Delivery issue"
    requestPlural: "Delivery issues"
    incident: "Service disruption"
    incidentPlural: "Service disruptions"
    workOrder: "Dispatch task"
    asset: "Truck"
    assetPlural: "Trucks"
    requestCategories: [damaged-cargo, delivery-delay, missed-pickup, driver-issue, billing-question, other]
    billingTitle: "Pay Freight Invoices"
    billingSubtitle: "Your Meridian Freight invoices and payment history."
    billNoun: "freight invoice"
    # Rule P2 — required because `iot` is in screens.ops below.
    iotCategory1: "Line-Haul Tractors"
    iotCategory2: "Reefer Trailers"
    iotCategory3: "Dock Doors"
    iotIdPrefix1: "trk"
    iotIdPrefix2: "trl"
    iotIdPrefix3: "dck"
  screens:
    public:
      - home
      - { id: service-requests, label: "Delivery issues" }
      - billing
      - messages
    ops:
      - overview
      - id: fleet-map
        template: entity-map
        entityType: journey          # reserved — see AUTHORING_PROMPT.md Step 3b
        label: "Fleet Map"
        icon: "🚚"
        viewBox: "0 0 1000 700"
        labelField: destination
        background:
          kind: shapes
          shapes:
            # Ocean/canvas backdrop
            - { type: rect, x: 0, "y": 0, width: 1000, height: 700, fill: "#0b1220" }
            - { type: text, x: 500, "y": 40, text: "WASHINGTON STATE — FLEET NETWORK", fill: "#64748b", "font-size": 14, "text-anchor": middle }
            # Simplified Washington State outline (schematic, not survey-accurate) —
            # Pacific coast west, Canada border north, Idaho border east, Columbia
            # River south — traced as connected line segments (no path/polygon
            # primitive is supported by the entity-map shapes renderer).
            - { type: line, x1: 90,  "y1": 170, x2: 170, "y2": 140, stroke: "#334155", "stroke-width": 2 }
            - { type: line, x1: 170, "y1": 140, x2: 350, "y2": 110, stroke: "#334155", "stroke-width": 2 }
            - { type: line, x1: 350, "y1": 110, x2: 550, "y2": 105, stroke: "#334155", "stroke-width": 2 }
