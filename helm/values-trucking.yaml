      - { id: requests, label: "Dispatch queue" }
      - { id: incidents, label: "Service disruptions" }
      - { id: iot, label: "Fleet & Trailers" }
      - { id: analytics, label: "On-time performance" }
      - demo-control
  home:
    public:
      - { id: welcome-hero, position: full }
      - id: freight-news
        template: ticker
        position: full
        height: slim
        label: "📦 FREIGHT UPDATES"
        items:
          - "I-5 corridor running on schedule — no delays reported"
          - "New spoke added: Seattle DC to Wenatchee Hub, daily service"
          - "Winter weather advisory: Snoqualmie Pass may affect Yakima/Spokane routes"
          - "Meridian Freight adds 12 tractors to Puget Sound fleet"
          - "Fuel surcharge adjusted for Q3 — see your invoice for details"
      - id: fleet-map
        template: entity-map
        position: full
        entityType: journey
        viewBox: "0 0 1000 700"
        labelField: destination
        background:
