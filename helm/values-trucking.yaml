            - { type: line, x1: 860, "y1": 610, x2: 700, "y2": 600, stroke: "#334155", "stroke-width": 2 }
            - { type: line, x1: 700, "y1": 600, x2: 560, "y2": 630, stroke: "#334155", "stroke-width": 2 }
            - { type: line, x1: 560, "y1": 630, x2: 420, "y2": 605, stroke: "#334155", "stroke-width": 2 }
