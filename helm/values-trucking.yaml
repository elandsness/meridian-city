            # Hubs
            - { type: circle, cx: 260, cy: 280, r: 9, fill: "#fbbf24" }
            - { type: text, x: 260, "y": 262, text: "Seattle DC", fill: "#f1f5f9", "font-size": 14, "font-weight": bold, "text-anchor": middle }
