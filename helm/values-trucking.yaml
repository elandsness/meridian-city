      - { category: damaged-cargo,    title: "Temperature-sensitive load compromised", description: "Reefer trailer lost power during transit; contents may be spoiled." }
      - { category: delivery-delay,   title: "Delivery running 6+ hours behind",       description: "Driver reports Snoqualmie Pass closure; delivery ETA pushed to tomorrow." }
      - { category: delivery-delay,   title: "Missed delivery appointment window",     description: "Consignee's dock was unavailable at the scheduled time; redelivery needed." }
      - { category: delivery-delay,   title: "Extended dwell time at destination dock", description: "Driver has been waiting over 3 hours to unload; detention charges may apply." }
      - { category: missed-pickup,    title: "Pickup not completed at Tacoma Hub",     description: "Scheduled pickup was skipped; shipper is asking for a same-day rescue pickup." }
      - { category: missed-pickup,    title: "Bill of lading mismatch at pickup",      description: "Piece count on the BOL didn't match what was loaded; pickup was refused." }
      - { category: driver-issue,     title: "Driver reported unsafe loading dock",    description: "Driver flagged a loading dock at Yakima Depot with a broken safety rail." }
      - { category: driver-issue,     title: "Hours-of-service limit reached mid-route", description: "Driver must take a mandatory rest break; shipment will be relayed to another tractor." }
      - { category: billing-question, title: "Invoice discrepancy on fuel surcharge",  description: "Customer disputes the fuel surcharge line item on their latest invoice." }
      - { category: billing-question, title: "Reweigh/reclass dispute",                description: "Customer disputes a freight class change applied after a terminal reweigh." }
    chatQuestions:
      - "Where is my shipment right now?"
      - "How do I file an OS&D claim for damaged cargo?"
      - "How do I pay my freight invoice?"
      - "Can I schedule a new pickup?"
      - "What's your on-time delivery rate?"
      - "How do I dispute a billing charge?"
      - "What's detention time and when does it apply?"
  routing:
    damaged-cargo: "Claims & Damage Resolution"
    delivery-delay: "Dispatch Operations"
    missed-pickup: "Dispatch Operations"
    driver-issue: "Safety & Fleet Compliance"
    billing-question: "Billing & Accounts"
    other: "General Support"
  # Frontend-only visual metadata for the entity-map/entity-list templates --
  # status -> glyph/tone/terminal (Step 3b). journey-service's own state machine
  # is fixed globally (initiated -> in_progress -> completed); this block must
  # only use those status names, never invent new ones.
  entities:
    journey:
      displayName: "Shipment"
      displayNamePlural: "Shipments"
      fields:
        origin:
          type: enum
          values: ["Seattle DC", "Tacoma Hub", "Olympia Depot", "Bellingham Hub", "Wenatchee Hub", "Yakima Depot", "Spokane Terminal"]
        destination:
          type: enum
          values: ["Seattle DC", "Tacoma Hub", "Olympia Depot", "Bellingham Hub", "Wenatchee Hub", "Yakima Depot", "Spokane Terminal"]
        status:
          type: enum
          values: [in_progress, completed]
      initial: in_progress
      states:
        in_progress: { label: "En route", tone: blue, glyph: "🚚" }
        completed: { label: "Delivered", tone: green, glyph: "✅", terminal: true }
      transitions:
        - { from: in_progress, to: completed }
  # Dynatrace reskin (Path A): rename the service map and Business Flow titles.
  dynatrace:
    serviceNames:
      citizen-service: "Shipper Portal"
      service-dispatch: "Dispatch Operations"
      city-operations: "Fleet Operations"
      api-gateway: "Freight API Gateway"
      notification-service: "Shipper Notifications"
      billing-service: "Freight Billing"
    flowLabels:
      service-request: "Delivery Issue Resolution"
      account-creation: "Shipper Account Setup"
      iot-incident: "Fleet Incident Resolution"
      tax-payment: "Freight Invoice Payment"
      # "journey" isn't a legacy hand-written flow id -- it's auto-derived from
      # entities.journey.states/transitions above (see AUTHORING_PROMPT.md Step 3b
      # and provision-dynatrace-business-config.py's
      # derive_flow_specs_from_entity_config()). journey-service must emit its
      # business events as "journey.<status>" for this to actually populate.
      journey: "Shipment Delivery"
    flows:
      - service-request
      - account-creation
      - iot-incident
      - tax-payment
      - journey

# -----------------------------------------------------------------------------
# journeyService generator overrides — TOP-LEVEL (outside industry:), same as
# the customerEntityService/opsEntityService pattern: this configures the
# actual backend simulation, not just frontend labels. Generates "truck"
# journeys along the routes below instead of the default flight/passenger.
# Every route originates at Seattle DC (hub-and-spoke), matching the fleet-map
# background's route lines and hub coordinates exactly. Lifecycle timing is
# shortened from the default 5min-2hr band so movement is visible within a
# normal demo session.
# -----------------------------------------------------------------------------
journeyService:
  enabled: true   # off by default in the base chart -- this config needs it (entityType: journey)
  lifecycle:
    minSeconds: 25
    maxSeconds: 90
  generator:
    maxActive: 12
    entityTypes: ["truck"]
    initialStatuses:
      truck: "in_progress"
    routes:
      - { origin: "Seattle DC", destination: "Tacoma Hub",       originX: 260, originY: 280, destX: 270, destY: 330 }
      - { origin: "Seattle DC", destination: "Olympia Depot",    originX: 260, originY: 280, destX: 240, destY: 400 }
      - { origin: "Seattle DC", destination: "Bellingham Hub",   originX: 260, originY: 280, destX: 230, destY: 160 }
      - { origin: "Seattle DC", destination: "Wenatchee Hub",    originX: 260, originY: 280, destX: 520, destY: 250 }
      - { origin: "Seattle DC", destination: "Yakima Depot",     originX: 260, originY: 280, destX: 480, destY: 430 }
      - { origin: "Seattle DC", destination: "Spokane Terminal", originX: 260, originY: 280, destX: 800, destY: 280 }
