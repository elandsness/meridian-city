industry:
  version: 1
  id: banking
  company:
    name: "Meridian Bank"
    short: "Meridian"
    tagline: "Unexpectedly Human Banking."
    assistant:
      name: "Mera"
      persona: "the Meridian Bank virtual assistant"
      supportPhone: "1-800-MERIDIAN"
      systemPrompt: |-
        You are Mera, the virtual assistant for Meridian Bank. Help customers navigate
        their digital banking, check balances, pay credit card bills, dispute charges,
        find ATMs, and report lost cards. Be professional, secure, and concise. Always
        advise users not to share their full account numbers in the chat.
  theme:
    colors:
      brand: "#00B33A"             # Signature TD-style Green
      brandDeep: "#00822A"         # Darker forest green for headers/active states
      brandSoft: "#4DCC75"         # Lighter green for hovers
      brandTint: "#E6F7EB"         # Very light green wash for backgrounds
      accent: "#1E293B"            # Professional slate gray/navy for contrast
      accentSoft: "#334155"        # Lighter slate
      accentInk: "#FFFFFF"         # White text on accent backgrounds
    logo: ""                       # Uses built-in mark, which will recolor to brand hex
    favicon: ""
  terminology:
    customer: "Customer"
    customerPlural: "Customers"
    request: "Support ticket"
    requestPlural: "Support tickets"
    incident: "System alert"
    incidentPlural: "System alerts"
    workOrder: "Maintenance ticket"
    asset: "ATM"
    assetPlural: "ATMs"
    iotCategory1: "ATMs"
    iotCategory2: "Branches"
    iotCategory3: "Cash Machines"
    billingTitle: "Pay Bills & Cards"
    billingSubtitle: "Your Meridian Bank credit card and loan payments."
    billNoun: "payment"
    requestCategories: [account-issue, card-dispute, loan-inquiry, fraud-report, password-reset, other]
    iotIdPrefix1: "atm"
    iotIdPrefix2: "br"
    iotIdPrefix3: "cm"
    iotZoneLabels:
      zone-north: "Northeast"
      zone-south: "Southeast"
      zone-east: "Midwest"
      zone-west: "West Coast"
      zone-central: "Digital Channels"
    iotAnomalyLabels:
      engine_overtemp: "Cash Dispenser Overheating"
      high_speed: "Network Latency Spike"
      hvac_overtemp: "Branch HVAC Fault"
      high_co2: "Branch Air Quality Alert"
      high_vibration: "ATM Mechanical Vibration"
      high_error_rate: "ATM Transaction Error Rate"
  screens:
    public:
      - home
      - { id: billing, label: "Pay Bills & Cards" }
      - { id: service-requests, label: "Help & Support" }
      - messages
      - id: loan-tracker
        template: entity-journey
        entityType: loan_application
        label: "My Loan Application"
        icon: "🏦"
        ownerField: applicant_name
        steps:
          - { state: submitted, label: "Application Received" }
          - { state: credit_check, label: "Credit Check" }
          - { state: underwriting, label: "Underwriting Review" }
          - { state: approved, label: "Approved ✓" }
        description: "Track your loan application through each review stage in real time."
    ops:
      - overview
      - id: loan-pipeline
        template: entity-list
        entityType: loan_application
        label: "Loan Pipeline"
        icon: "📋"
      - { id: requests, label: "Support Queue" }
      - { id: incidents, label: "IT Incidents" }
      - { id: iot, label: "ATM Network" }
      - { id: analytics, label: "Transaction Analytics" }
      - demo-control
  home:
    public:
      - id: market-ticker
        template: ticker
        height: slim
        label: "📈 RATES"
        items:
          - "30-yr Fixed Mortgage: 6.85%  ↓0.05%"
          - "15-yr Fixed Mortgage: 6.12%  ↓0.03%"
          - "5/1 ARM: 5.94%  ▲0.08%"
          - "6-Month CD: 4.85% APY  ·  1-Yr CD: 5.10% APY"
          - "Prime Rate: 7.50% — Fed holds steady"
          - "High-Yield Savings: 4.60% APY — no minimum balance"
      - welcome-hero
      - quick-actions
      - id: branch-notices
        template: announcements
        title: "Branch Updates"
        items:
          - "New: Set up automatic bill pay in 2 minutes directly in the Meridian Bank app."
          - "Downtown location now open Saturdays 9 AM – 2 PM starting this weekend."
          - "Reminder: Meridian will never ask for your full account number by text or phone."
    ops:
      - id: loan-kpi
        template: entity-kpi-row
        entityTypes: [loan_application]
      - ops-overview
  data:
    zones: ["northeast-region", "midwest-region", "south-region", "west-coast", "digital-channels"]
    requestTemplates:
      - { category: card-services, title: "Report Lost or Stolen Card", description: "Customer reported missing credit or debit card. Needs immediate freeze and replacement issuance." }
      - { category: card-services, title: "Credit Card Billing Dispute", description: "Customer is contesting a recent credit card charge as fraudulent or unrecognized." }
      - { category: digital-banking, title: "Mobile App Login Issue", description: "Customer is locked out of the mobile banking app or experiencing biometric login failures." }
      - { category: branch-ops, title: "ATM Cash Dispense Error", description: "ATM debited account but did not dispense physical cash." }
      - { category: fraud-claims, title: "Suspicious Wire Transfer", description: "Flagged outbound wire transfer requiring secondary customer verification." }
    chatQuestions:
      - "How do I pay my credit card bill?"
      - "I lost my debit card, what should I do?"
      - "Where is the nearest ATM?"
      - "Why is my account locked?"
      - "How do I dispute a credit card charge?"
      - "What is my current mortgage rate?"
      - "How do I apply for a personal loan?"
  routing:
    card-services: "Card Operations"
    digital-banking: "Digital Channel Support"
    branch-ops: "Branch & ATM Network"
    fraud-claims: "Fraud Detection Unit"
  dynatrace:
    serviceNames:
      citizen-service: "Digital Banking Portal"
      city-operations: "Core Banking Operations"
      service-dispatch: "Case Management System"
      api-gateway: "Open Banking API Gateway"
      notification-service: "Alerts & OTP Service"
      billing-service: "Payments & Transfers Service"
    flowLabels:
      service-request: "Customer Support Resolution"
      account-creation: "Digital Account Opening"
      iot-incident: "ATM Network Outage"
      tax-payment: "Credit Card Bill Payment"
      loan_application: "Loan Application Journey"
    flows:
      - service-request
      - account-creation
      - iot-incident
      - tax-payment
  analytics:
    flows:
      - service-request
      - account-creation
      - iot-incident
      - tax-payment
      - loan_application
    flowLabels:
      service-request: "Customer Support Resolution"
      account-creation: "Digital Account Opening"
      iot-incident: "ATM Network Outage"
      tax-payment: "Credit Card Bill Payment"
      loan_application: "Loan Application Journey"
  entities:
    # -----------------------------------------------------------------------
    # LOAN APPLICATION — customer-facing loan lifecycle
    # Tracks a loan from submission through credit check, underwriting,
    # and final approval or denial. Customers can track their own application
    # via the loan-tracker entity-journey screen (ownerField: applicant_name).
    # -----------------------------------------------------------------------
    loan_application:
      displayName: "Loan Application"
      displayNamePlural: "Loan Applications"
      idPrefix: "loan"
      fields:
        applicant_name: { type: string }
        loan_type:
          type: enum
          values: [mortgage, auto, personal, business]
          default: personal
        amount: { type: number }
        credit_score: { type: number }
      initial: submitted
      states:
        submitted: { label: "Submitted", tone: blue }
        credit_check: { label: "Credit Check", tone: amber }
        underwriting: { label: "Underwriting", tone: amber }
        on_hold: { label: "On Hold", tone: slate }
        approved: { label: "Approved", tone: green, terminal: true, isKpi: true }
        denied: { label: "Denied", tone: red, terminal: true, isError: true }
      transitions:
        - from: submitted
          to: credit_check
          timer: { minSeconds: 30, maxSeconds: 120 }
        - from: credit_check
          to: on_hold
          when: { faultGate: "loan-credit-check-flag", probability: 0.08 }
          timer: { minSeconds: 60, maxSeconds: 240 }
        - from: credit_check
          to: denied
          when: { probability: 0.06 }
          timer: { minSeconds: 60, maxSeconds: 240 }
        - from: credit_check
          to: underwriting
          timer: { minSeconds: 60, maxSeconds: 240 }
        - from: on_hold
          to: underwriting
          timer: { minSeconds: 300, maxSeconds: 900 }
        - from: underwriting
          to: denied
          when: { faultGate: "loan-underwriting-denied", probability: 0.12 }
          timer: { minSeconds: 120, maxSeconds: 600 }
        - from: underwriting
          to: approved
          when: { probability: 0.85 }
          timer: { minSeconds: 120, maxSeconds: 600 }
        - from: underwriting
          to: denied
          timer: { minSeconds: 120, maxSeconds: 600 }
      generator:
        strategy: simpleSteadyState
        intervalMs: 90000
        maxActive: 12
        fields:
          applicant_name: { faker: fullName }
          amount: { min: 5000, max: 500000 }
          credit_score: { min: 580, max: 820 }

    # Override incident Kafka trigger for banking: map city-device anomaly descriptions
    # to ATM/branch appropriate titles. Physics (sensor metrics) come from the
    # shared iot-simulator; this mapping translates at the entity creation boundary.
    incident:
      displayName: "System Alert"
      displayNamePlural: "System Alerts"
      idPrefix: "inc"
      fields:
        asset_id: { type: string }
        source:
          type: enum
          values: [manual, iot]
          default: manual
        severity:
          type: enum
          values: [low, medium, high, critical]
          default: medium
        title: { type: string }
        description: { type: string }
        zone_id: { type: string }
      initial: detecting
      states:
        detecting: { label: "Detecting", tone: amber }
        open:
          label: "Open"
          tone: red
          isKpi: true
        resolved:
          label: "Resolved"
          tone: green
          terminal: true
          isKpi: true
          externallyTriggered: true
      transitions:
        - from: open
          to: resolved
          userTriggerable: true
          label: "Resolve"
        - from: detecting
          to: open
          timer: { minSeconds: 5, maxSeconds: 30 }
          effects:
            - action: spawnLinked
              entityType: work_order
              fields:
                incident_id: { from: id }
                title: { from: title }
                zone_id: { from: zone_id }
                priority:
                  from: severity
                  map:
                    critical: urgent
                    high: high
                    medium: normal
                    low: normal
                  default: normal
      triggers:
        kafka:
          - topic: iot.anomalies
            fieldMapping:
              asset_id: { from: device_id }
              severity:
                from: severity
                map:
                  warning: medium
                  critical: critical
                  high: high
                  low: low
                default: medium
              source: { value: iot }
              title:
                from: anomaly_type
                map:
                  "Engine overtemperature": "Cash Dispenser Overheating"
                  "Excessive speed": "ATM Network Latency Alert"
                  "HVAC overtemperature": "Branch HVAC System Fault"
                  "High CO2 level": "Branch Air Quality Warning"
                  "High vibration": "ATM Mechanical Vibration Alert"
                  "Elevated error rate": "ATM Transaction Error Rate Alert"
                default: "ATM System Alert"
              description: { from: metric_name }

    # Override the base bill entity for banking: monthly credit card statements
    # with realistic payment amounts ($20–$800) and 21-day due dates.
    # Must repeat required schema fields (fields/initial/states) even though
    # they're identical to the base — the validator treats each entity as complete.
    bill:
      displayName: "Credit Card Statement"
      displayNamePlural: "Credit Card Statements"
      idPrefix: "bill"
      fields:
        citizen_id: { type: string }
        period: { type: string }
        amount_cents: { type: number, default: 0 }
        issued_at: { type: string }
        due_at: { type: string }
        paid_at: { type: string }
      initial: outstanding
      states:
        outstanding:
          label: "Outstanding"
          tone: amber
          isKpi: true
        paid:
          label: "Paid"
          tone: green
          terminal: true
          isKpi: true
          kpiField: amount_cents
        payment_failed:
          label: "Payment Failed"
          tone: red
          terminal: true
          isError: true
      transitions:
        - from: outstanding
          to: payment_failed
          userTriggerable: true
          when: { faultGate: "tax-payment-failed", probability: 0.3 }
          label: "Pay Now"
        - from: outstanding
          to: paid
          userTriggerable: true
          label: "Pay Now"
          effects:
            - action: set
              target: self
              field: paid_at
              value: "${now}"
      generator:
        strategy: periodicHistoryBackfill
        ownerEntityType: citizen
        ownerField: citizen_id
        periodField: period
        periodFrequency: monthly
        backfill:
          minPeriods: 3
          maxPeriods: 12
          outstandingMin: 1
          outstandingMax: 2
        amount:
          minCents: 2000
          maxCents: 80000
        dueDays: 21
