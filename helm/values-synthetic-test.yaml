# THROWAWAY Stage 2 proving-ground overlay for the generic-entity-engine
# initiative -- NOT a real industry. Deliberately designed to exercise every
# Tier-2 modeling primitive at once (branching transition, timer, cross-entity
# reference + effect, optional step, computed position) on synthetic entity
# types (probe/inspection) with no relation to any real domain, so bugs in the
# engine get found here instead of on City/Airport's real data.
#
# Usage:
#   ./scripts/deploy.sh install -f helm/values-custom.yaml -f helm/values-synthetic-test.yaml
#
# Its only job is to die once Stage 5's integration checkpoint passes -- see
# the plan file referenced from the project_generic_entity_engine memory.
industry:
  entities:
    probe:
      displayName: "Probe"
      displayNamePlural: "Probes"
      idPrefix: "prb"
      fields:
        probe_code:
          type: string
        zone:
          type: enum
          values: ["north", "south"]
        escalations:
          type: number
          default: 0
      initial: queued
      states:
        queued:
          label: "Queued"
          tone: slate
        scanning:
          label: "Scanning"
          tone: blue
        fault_detected:
          label: "Fault detected"
          tone: red
          terminal: true
          isError: true
        validating:
          label: "Validating"
          tone: amber
        complete:
          label: "Complete"
          tone: green
          terminal: true
          isKpi: true
      transitions:
        - from: queued
          to: scanning
          timer: { minSeconds: 5, maxSeconds: 15 }
        - from: scanning
          to: fault_detected
          when: { faultGate: "probe-fault-detected", probability: 0.2 }
          timer: { minSeconds: 5, maxSeconds: 15 }
        - from: scanning
          to: validating
          timer: { minSeconds: 5, maxSeconds: 15 }
        - from: validating
          to: complete
          timer: { minSeconds: 5, maxSeconds: 15 }
      computed:
        position:
          type: point2d
          interpolation: easeInOut
          # NOTE: "y" must be quoted -- unquoted, YAML 1.1 (which Helm's parser
          # uses) reads the bareword key `y` as the boolean `true` (the classic
          # "Norway problem" -- also affects Yes/No/On/Off/y/n as both keys and
          # values), which then serializes as the JSON key "true". Caught by
          # rendering this file with `helm template` before deploying it -- see
          # docs/regression-baseline-2026-07-23.md-style verification habits.
          waypoints:
            queued: { x: 10, "y": 100 }
            scanning: { x: 50, "y": 100 }
            validating: { x: 90, "y": 100 }
            complete: { x: 130, "y": 100 }
            fault_detected: { x: 50, "y": 160 }
      generator:
        strategy: simpleSteadyState
        intervalMs: 8000
        maxActive: 5
    inspection:
      displayName: "Inspection"
      displayNamePlural: "Inspections"
      idPrefix: "insp"
      fields:
        thorough:
          type: boolean
          default: false
        probe_id:
          type: ref
          entity: probe
      linkOnCreate:
        probe_id:
          query:
            entity: probe
            filter:
              stateNotIn: ["fault_detected", "complete"]
          strategy: random
          required: false
      initial: assigned
      states:
        assigned:
          label: "Assigned"
          tone: slate
        detail_check:
          label: "Detail check"
          tone: amber
        approved:
          label: "Approved"
          tone: green
          terminal: true
          isKpi: true
      transitions:
        - from: assigned
          to: detail_check
          when: { field: thorough, equals: true }
          timer: { minSeconds: 5, maxSeconds: 10 }
        - from: assigned
          to: approved
          when: { field: thorough, equals: false }
          timer: { minSeconds: 5, maxSeconds: 10 }
          effects:
            - { target: "link.probe_id", action: increment, field: escalations }
        - from: detail_check
          to: approved
          timer: { minSeconds: 5, maxSeconds: 10 }
          effects:
            - { target: "link.probe_id", action: increment, field: escalations }
      generator:
        strategy: simpleSteadyState
        intervalMs: 6000
        maxActive: 8
        fields:
          thorough: { probability: 0.5 }
