# =============================================================================
# Meridian City Platform — Helm Values
# =============================================================================
# Copy this file to values-custom.yaml and fill in the required values.
# Required fields are marked with: # REQUIRED
# =============================================================================

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------
# Registry prefix for meridian-city application images only.
# Kept outside of `global` so Bitnami/OTel sub-charts never inherit it
# (Helm propagates every key under `global` to sub-charts automatically).
# All service images are resolved as: <appImageRegistry>/<service-name>:<imageTag>
appImageRegistry: "ghcr.io/your-org/meridian-city-platform"

global:
  imageTag: "latest"
  # Namespace the instance's app resources deploy into. Leave empty to follow the
  # Helm release namespace (the `-n` flag) — scripts/deploy.sh installs each
  # instance into `meridian-<hash>`, so every install lands in its own namespace.
  # Set explicitly only to pin a namespace that differs from the release namespace.
  namespace: ""
  # Per-instance hash (e.g. "a1b2") — the SINGLE source of truth for multi-tenancy.
  # scripts/deploy.sh generates it once and passes it here (and bakes it into the
  # release name `meridian-<hash>`). It is fanned out via helm/templates/_helpers.tpl
  # to the Dynatrace identity (deployment.environment suffix). Helm template
  # randomness is not stable across upgrades, so this is a seeded value, never
  # generated at render time. Leave empty for a legacy single-instance install.
  instanceHash: ""
  # Always pull so that a fresh CI build of the floating ":latest" tag is
  # actually fetched on each (re)deploy.  With IfNotPresent, a kind node that
  # already cached ":latest" will keep serving the stale image after CI
  # rebuilds it — pods silently run old code until the cached layer is purged.
  # If you pin imageTag to an immutable tag (e.g. a git SHA), IfNotPresent is
  # safe and faster; revert this then.
  imagePullPolicy: Always
  imagePullSecrets: []

# ---------------------------------------------------------------------------
# Industry config (multi-industry platform)
# ---------------------------------------------------------------------------
# Rendered to /config.json by templates/industry-configmap.yaml, mounted into both
# frontends, and merged over each SPA's baked defaults at startup. BROWSER-VISIBLE
# ONLY — never put secrets here. The default below reproduces "Meridian City".
# Keep in sync with frontends/*/src/config/defaults.js and
# docs/industry-config.schema.json. To re-skin an instance, override this block in
# a values-<industry>.yaml passed to deploy.sh (e.g. -f helm/values-airport.yaml).
industry:
  version: 1
  id: city
  company:
    name: "Meridian City"
    short: "Meridian"
    tagline: "Your city, connected."
    assistant:
      name: "Meri"
      persona: "Meridian City's virtual assistant"
  theme:
    colors:
      brand: "#0C447C"
      brandDeep: "#082f57"
      brandSoft: "#185FA5"
      brandTint: "#E6F1FB"
      accent: "#EF9F27"
      accentSoft: "#f6b54e"
      accentInk: "#412402"
    logo: ""  # empty = built-in BrandMark; an industry overlay sets its own
    favicon: "/meridian-logo.svg"
  terminology:
    customer: "Citizen"
    customerPlural: "Citizens"
    request: "Service request"
    requestPlural: "Service requests"
    incident: "Incident"
    incidentPlural: "Incidents"
    workOrder: "Work order"
    asset: "Asset"
    assetPlural: "Assets"
  screens:
    public: ["home", "service-requests", "store", "billing", "messages"]
    ops: ["overview", "iot", "incidents", "requests", "analytics", "demo-control"]
    disabled: []
  # Home-page module composition per SPA (module ids from frontends/*/src/config/homeModules.jsx).
  # Absent falls back to the city bundle; an industry overlay supplies its own.
  home:
    public:
      - id: cityband
        template: ticker
        height: slim
        label: "🏙️ CITY NEWS"
        items:
          - "City Hall announces $2M parks renovation starting Spring 2026"
          - "Transit expansion: Blue Line extended to North Heights — opens June 2026"
          - "Meridian Central Station wins Best Urban Infrastructure award"
          - "Community solar program now open for residential sign-ups"
          - "Water main upgrade complete — service fully restored citywide"
      - city-home
      - transit-map
      - quick-actions
    ops: ["ops-overview"]
  # Backend-only demo-data pools + dispatch routing. NOT rendered into the browser
  # config.json (see industry-configmap.yaml). Empty = services use their built-in
  # City defaults; an industry overlay (e.g. values-airport.yaml) supplies its own.
  data: {}
  routing: {}
  # Per-industry Dynatrace: {serviceNames: {deployment: displayName}, flowLabels: {flowKey: name}}.
  # Applied by the provisioner Job, scoped to this instance's namespace. Empty = City defaults.
  dynatrace: {}
  # Config-driven entity/lifecycle definitions for the generic entity engine.
  # customer-entity-service owns: citizen, service_request, bill, cart
  # ops-entity-service owns: incident, work_order
  # See docs/industry-config.schema.json and the generic-entity-engine plan.
  entities:
    # -----------------------------------------------------------------------
    # CITIZEN — account creation lifecycle
    # Replaces citizen-service's AccountLifecycleScheduler.
    # Created externally (traffic-bot / REST), no generator.
    # -----------------------------------------------------------------------
    citizen:
      displayName: "Citizen"
      displayNamePlural: "Citizens"
      idPrefix: "cit"
      fields:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
        zone_id: { type: string }
        password: { type: password }
      initial: verification_sent
      states:
        verification_sent: { label: "Verification Sent", tone: amber }
        verified: { label: "Verified", tone: blue }
        verification_failed:
          label: "Verification Failed"
          tone: red
          terminal: true
          isError: true
        activated:
          label: "Activated"
          tone: green
          terminal: true
          isKpi: true
        abandoned: { label: "Abandoned", tone: slate, terminal: true }
        verified_only: { label: "Verified Only", tone: slate, terminal: true }
        activation_failed:
          label: "Activation Failed"
          tone: red
          terminal: true
          isError: true
      transitions:
        # Fault path evaluated first -- gate off by default (rate 0), so
        # normal deploys never see it unless demo-control enables the gate.
        - from: verification_sent
          to: verification_failed
          when: { faultGate: "account-verification-failed", probability: 0.05 }
          timer: { minSeconds: 300, maxSeconds: 7200 }
        - from: verification_sent
          to: verified
          when: { probability: 0.85 }
          timer: { minSeconds: 300, maxSeconds: 7200 }
        # Catch-all: drop-off if neither fault nor probability fired.
        - from: verification_sent
          to: abandoned
          timer: { minSeconds: 300, maxSeconds: 7200 }
        - from: verified
          to: activation_failed
          when: { faultGate: "account-activation-failed", probability: 0.05 }
          timer: { minSeconds: 300, maxSeconds: 7200 }
        - from: verified
          to: activated
          when: { probability: 0.92 }
          timer: { minSeconds: 300, maxSeconds: 7200 }
        - from: verified
          to: verified_only
          timer: { minSeconds: 300, maxSeconds: 7200 }

    # -----------------------------------------------------------------------
    # SERVICE REQUEST — citizen-submitted request lifecycle
    # Replaces CitizenService + RequestLifecycleScheduler.
    # On submitted→validated: calls routing-service (department assignment)
    # then calls ops-entity-service to create a linked work_order.
    # citizen_id is plain string (not ref) so the field lives in data JSONB
    # and can be queried directly -- no cross-entity effects from request→citizen.
    # -----------------------------------------------------------------------
    service_request:
      displayName: "Service Request"
      displayNamePlural: "Service Requests"
      idPrefix: "req"
      fields:
        citizen_id: { type: string }
        category: { type: string }
        priority:
          type: enum
          values: [low, normal, high, urgent]
          default: normal
        title: { type: string }
        description: { type: string }
        zone_id: { type: string }
        assigned_department: { type: string }
        assigned_to: { type: string }
      initial: submitted
      states:
        submitted: { label: "Submitted", tone: slate }
        rejected:
          label: "Rejected"
          tone: red
          terminal: true
          isError: true
        validated: { label: "Validated", tone: blue }
        in_progress:
          label: "In Progress"
          tone: amber
          isKpi: true
        resolved:
          label: "Resolved"
          tone: green
          terminal: true
          isKpi: true
        abandoned: { label: "Abandoned", tone: slate, terminal: true }
      transitions:
        - from: submitted
          to: rejected
          when: { faultGate: "service-request-rejected", probability: 0.1 }
          timer: { minSeconds: 300, maxSeconds: 7200 }
        - from: submitted
          to: validated
          timer: { minSeconds: 300, maxSeconds: 7200 }
          effects:
            # Step 1: ask routing-service for the responsible department;
            # result is written back to assigned_department on this entity.
            # Step 2 then reads that field to pass it to the work_order.
            - action: callService
              url: "${ROUTING_SERVICE_URL}/api/v1/route"
              method: POST
              body:
                category: { from: category }
                zone_id: { from: zone_id }
              responseFields:
                assigned_department: department
            # Step 2: create a linked work_order on ops-entity-service.
            # Best-effort -- a downstream failure is logged and skipped.
            - action: callService
              url: "${OPS_ENTITY_SERVICE_URL}/api/v1/entities/work_order"
              method: POST
              body:
                request_id: { from: id }
                title: { from: title }
                priority: { from: priority }
                assigned_department: { from: assigned_department }
                zone_id: { from: zone_id }
        - from: validated
          to: in_progress
          timer: { minSeconds: 300, maxSeconds: 7200 }
        - from: in_progress
          to: resolved
          when: { probability: 0.88 }
          timer: { minSeconds: 300, maxSeconds: 7200 }
        # Drop-off: ~12% of in_progress requests are abandoned (no match above).
        - from: in_progress
          to: abandoned
          timer: { minSeconds: 300, maxSeconds: 7200 }

    # -----------------------------------------------------------------------
    # BILL (tax bill) — quarterly billing lifecycle
    # Replaces billing-service's BillingService + BillingScheduler.
    # periodicHistoryBackfill: for every citizen, seeds 2-8 quarters of bill
    # history on first tick, then issues one new bill per quarter.
    # citizen_id is plain string (not ref) -- TransitionScheduler's
    # groupingBy uses getField(), which reads data JSONB only.
    # -----------------------------------------------------------------------
    bill:
      displayName: "Tax Bill"
      displayNamePlural: "Tax Bills"
      idPrefix: "bill"
      fields:
        citizen_id: { type: string }
        period: { type: string }
        amount_cents: { type: number, default: 0 }
        issued_at: { type: string }
        due_at: { type: string }
        paid_at: { type: string }
      initial: outstanding
      states:
        outstanding:
          label: "Outstanding"
          tone: amber
          isKpi: true
        paid:
          label: "Paid"
          tone: green
          terminal: true
          isKpi: true
          kpiField: amount_cents
        payment_failed:
          label: "Payment Failed"
          tone: red
          terminal: true
          isError: true
      transitions:
        # Fault path first -- user action "Pay Now" tries this gate first.
        - from: outstanding
          to: payment_failed
          userTriggerable: true
          when: { faultGate: "tax-payment-failed", probability: 0.3 }
          label: "Pay Now"
        - from: outstanding
          to: paid
          userTriggerable: true
          label: "Pay Now"
          effects:
            - action: set
              target: self
              field: paid_at
              value: "${now}"
      generator:
        strategy: periodicHistoryBackfill
        ownerEntityType: citizen
        ownerField: citizen_id
        periodField: period
        backfill:
          minPeriods: 2
          maxPeriods: 8
          outstandingMin: 1
          outstandingMax: 2
        amount:
          minCents: 15000
          maxCents: 45000
        dueDays: 45

    # -----------------------------------------------------------------------
    # CART (collapses cart + order) — shopping and fulfillment lifecycle
    # Replaces commerce-service's CartService + OrderService + FulfillmentScheduler.
    # Cart item management (add/remove items) stays in a thin compatibility
    # layer on customer-entity-service for Stage 6; the state machine below
    # handles checkout and fulfillment only.
    # -----------------------------------------------------------------------
    cart:
      displayName: "Order"
      displayNamePlural: "Orders"
      idPrefix: "cart"
      fields:
        citizen_id: { type: string }
        total_cents: { type: number, default: 0 }
        item_count: { type: number, default: 0 }
      initial: open
      states:
        open: { label: "Open", tone: slate }
        payment_declined:
          label: "Payment Declined"
          tone: red
          terminal: true
          isError: true
        placed:
          label: "Order Placed"
          tone: blue
          isKpi: true
        packed: { label: "Packed", tone: amber }
        shipped: { label: "Shipped", tone: amber }
        delivered:
          label: "Delivered"
          tone: green
          terminal: true
          isKpi: true
          kpiField: total_cents
        delivery_failed:
          label: "Delivery Failed"
          tone: red
          terminal: true
          isError: true
      transitions:
        # Fault path evaluated first -- when demo-control enables the gate,
        # checkout calls hit payment_declined at the declared rate.
        - from: open
          to: payment_declined
          userTriggerable: true
          when: { faultGate: "checkout-payment-declined", probability: 0.25 }
          label: Checkout
        - from: open
          to: placed
          userTriggerable: true
          label: Checkout
        - from: placed
          to: packed
          timer: { minSeconds: 300, maxSeconds: 7200 }
        - from: packed
          to: shipped
          timer: { minSeconds: 300, maxSeconds: 7200 }
        - from: shipped
          to: delivery_failed
          when: { faultGate: "order-delivery-failed", probability: 0.1 }
          timer: { minSeconds: 300, maxSeconds: 7200 }
        - from: shipped
          to: delivered
          timer: { minSeconds: 300, maxSeconds: 7200 }

    # -----------------------------------------------------------------------
    # INCIDENT — operational incident lifecycle
    # Replaces city-operations IncidentService.
    # 'detecting' is a brief (5-30s) holding state that exists solely to run
    # the spawnLinked effect atomically in the same transaction as creation --
    # the entity engine has no 'creationEffects' hook, so this one-state
    # detour is the declarative equivalent of createFromIot()'s synchronous
    # incident+workorder creation block.
    # Kafka trigger for iot.anomalies: implemented by task #21 (kafkaTrigger
    # engine support); config declared here for completeness.
    # -----------------------------------------------------------------------
    incident:
      displayName: "Incident"
      displayNamePlural: "Incidents"
      idPrefix: "inc"
      fields:
        asset_id: { type: string }
        source:
          type: enum
          values: [manual, iot]
          default: manual
        severity:
          type: enum
          values: [low, medium, high, critical]
          default: medium
        title: { type: string }
        description: { type: string }
        zone_id: { type: string }
      initial: detecting
      states:
        detecting: { label: "Detecting", tone: amber }
        open:
          label: "Open"
          tone: red
          isKpi: true
        resolved:
          label: "Resolved"
          tone: green
          terminal: true
          isKpi: true
          externallyTriggered: true  # reached via work_order completion callService, not a local transition
      transitions:
        - from: detecting
          to: open
          timer: { minSeconds: 5, maxSeconds: 30 }
          effects:
            - action: spawnLinked
              entityType: work_order
              fields:
                incident_id: { from: id }
                title: { from: title }
                zone_id: { from: zone_id }
                priority:
                  from: severity
                  map:
                    critical: urgent
                    high: high
                    medium: normal
                    low: normal
                  default: normal
        # open→resolved is driven by the linked work_order's 'transition'
        # effect (work_order.resolved cascades incident to resolved).
        # No timer here -- incident resolution is always work_order-triggered.
      triggers:
        # Kafka bridge (task #21): on iot.anomalies message, create an
        # incident entity with the mapped fields below. fieldMapping uses
        # the same {from, value, map, default} spec as callService body.
        kafka:
          - topic: iot.anomalies
            fieldMapping:
              asset_id: { from: device_id }
              severity:
                from: severity
                map:
                  warning: medium
                  critical: critical
                  high: high
                  low: low
                default: medium
              source: { value: iot }
              title: { from: anomaly_type }
              description: { from: metric_name }

    # -----------------------------------------------------------------------
    # WORK ORDER — field operations lifecycle
    # Replaces city-operations WorkOrderService + WorkOrderLifecycleScheduler.
    # incident_id is ref-typed so it lands in links JSONB, enabling the
    # 'link.incident_id' transition effect target on the resolved transition.
    # -----------------------------------------------------------------------
    work_order:
      displayName: "Work Order"
      displayNamePlural: "Work Orders"
      idPrefix: "wo"
      fields:
        incident_id: { type: ref, entity: incident }
        request_id: { type: string }
        title: { type: string }
        assigned_department: { type: string }
        assigned_to: { type: string }
        priority:
          type: enum
          values: [normal, high, urgent]
          default: normal
        zone_id: { type: string }
      initial: created
      states:
        created: { label: "Created", tone: slate }
        assigned: { label: "Assigned", tone: blue }
        acknowledged: { label: "Acknowledged", tone: amber }
        resolved:
          label: "Resolved"
          tone: green
          terminal: true
          isKpi: true
        escalated:
          label: "Escalated"
          tone: red
          terminal: true
          isError: true
      transitions:
        - from: created
          to: assigned
          timer: { minSeconds: 300, maxSeconds: 7200 }
          effects:
            - action: set
              target: self
              field: assigned_to
              value: "Field Operations Team"
        - from: assigned
          to: acknowledged
          timer: { minSeconds: 300, maxSeconds: 7200 }
        - from: acknowledged
          to: escalated
          when: { faultGate: "work-order-escalated", probability: 0.1 }
          timer: { minSeconds: 300, maxSeconds: 7200 }
        - from: acknowledged
          to: resolved
          when: { probability: 0.85 }
          timer: { minSeconds: 300, maxSeconds: 7200 }
          effects:
            # Cascade resolution to the linked incident (if any -- request-
            # path work_orders have no incident link and this is a no-op).
            - action: transition
              target: link.incident_id
              to: resolved
        # Drop-off: ~15% of work orders loop (new timer) until resolved or
        # escalated -- no explicit abandoned state needed; scheduleNext
        # retries automatically when no transition matches.

# ---------------------------------------------------------------------------
# Dynatrace configuration
# ---------------------------------------------------------------------------
dynatrace:
  # REQUIRED: Dynatrace SaaS tenant API URL
  # Format: https://<environment-id>.live.dynatrace.com/api
  apiUrl: ""

  # REQUIRED: Dynatrace API token
  # Required scopes: metrics.ingest, logs.ingest, openTelemetryTrace.ingest,
  #                  entities.read, settings.write, DataExport
  apiToken: ""

  # REQUIRED: OTLP ingest endpoint for OpenTelemetry data
  # Format: https://<environment-id>.live.dynatrace.com/api/v2/otlp
  otlpEndpoint: ""

  # Dynatrace environment ID (the subdomain part of your tenant URL)
  # e.g., abc12345 from https://abc12345.live.dynatrace.com
  environmentId: ""

  # Deployment environment label (visible in Dynatrace entity properties).
  # This is the BASE label; the per-instance hash is suffixed automatically
  # (e.g. "demo" -> "demo-a1b2") so every concurrent instance is filterable by a
  # unique deployment.environment. Override the base here if "demo" is not wanted.
  deploymentEnvironment: "demo"

  # Kubernetes cluster name (visible in Dynatrace k8s monitoring).
  # Empty -> derived per-instance as "<release>-cluster" (e.g. meridian-a1b2-cluster)
  # so each instance is a distinct cluster entity on the shared tenant. Set a value
  # to pin a shared cluster name across instances (not recommended for multi-tenancy).
  clusterName: ""

  # Whether to deploy the Dynatrace Operator for OneAgent auto-instrumentation.
  # When enabled, the operator and a DynaKube CR are created in the 'dynatrace' namespace.
  operator:
    enabled: true

  # MULTI-TENANCY — cluster-monitoring ownership.
  # Every instance's DynaKube does per-namespace OneAgent applicationMonitoring
  # (code-module injection), which is safe to run many-at-once. But the Log Module
  # (logMonitoring) and the ActiveGate are NODE/CLUSTER-level singletons — the
  # Dynatrace admission webhook rejects a second DynaKube that also runs them
  # ("Only one Agent per node"). So exactly ONE instance per cluster owns them, and
  # because the Log Module captures EVERY namespace's stdout, that single owner's
  # logs feed all instances (each instance's OpenPipeline routing then extracts only
  # its own by namespace). scripts/deploy.sh sets this automatically: true for the
  # first instance on a cluster, false for the rest (detected by an existing
  # logMonitoring DynaKube). Leave true for a standalone/legacy single install.
  clusterMonitoring:
    enabled: true

  # Dynatrace Kubernetes Log Module — captures container stdout into Grail Logs
  # (this is what gets the business-event JSON logs in under applicationMonitoring).
  # Operator-managed DaemonSet, no privileged/hostPath, so it works on GKE Autopilot.
  # The tag MUST be pinned (no 'latest') and should track the OneAgent codeModules
  # version (check: kubectl -n dynatrace get dynakube <name> -o jsonpath
  # '{.status.codeModules.version}'). Tags: https://gallery.ecr.aws/dynatrace/dynatrace-logmodule
  logMonitoring:
    enabled: true
    image:
      repository: "public.ecr.aws/dynatrace/dynatrace-logmodule"
      tag: "1.339.55.20260615-110349"

  # Auto-provision business-observability config into the tenant on deploy:
  # an OpenPipeline pipeline that extracts the BusinessEvents JSON logs as
  # bizevents, plus a Business Flow per /analytics process. Idempotent hook Job.
  # Renders only when a platformToken (and an apps URL, derived from
  # environmentId if unset) are present — so it's a no-op until configured.
  businessConfig:
    enabled: true
    # Modern platform endpoint base. Optional: defaults to
    # https://<environmentId>.apps.dynatrace.com when environmentId is set.
    appsBaseUrl: ""
    # Platform token (dt0s16...) — required scopes:
    #   settings:objects:read, settings:objects:write, settings:schemas:read
    # NOTE: this is a PLATFORM token, distinct from dynatrace.apiToken (classic).
    platformToken: ""
    # bizevent provider stamped on every extracted Meridian business event.
    # Empty -> derived per-instance as "<release>.city" (e.g. meridian-a1b2.city)
    # so each instance's bizevents, OpenPipeline, and Business Flows are isolated
    # on the shared tenant. Set a value only to pin a shared provider.
    eventProvider: ""
    # Image used by the provisioning Job (needs Python 3 + CA certs)
    image: "python:3.12-slim"

# ---------------------------------------------------------------------------
# LLM / AI configuration (for the citizen chatbot and ai-service)
# ---------------------------------------------------------------------------
llm:
  # Provider selection: openai | anthropic | local
  provider: "openai"

  openai:
    # REQUIRED if provider=openai
    apiKey: ""
    model: "gpt-4o"
    baseUrl: "https://api.openai.com/v1"

  anthropic:
    # REQUIRED if provider=anthropic
    apiKey: ""
    model: "claude-sonnet-4-6"

  local:
    # Used when provider=local. When llm.provider == "local" the chart deploys
    # an in-cluster Ollama (helm/templates/ollama.yaml) reachable at `endpoint`,
    # and scripts/deploy.sh pulls `model` into it after the rollout (Ollama
    # starts with no models). For any other provider none of this renders.
    endpoint: "http://ollama:11434"
    model: "llama3"
    ollama:
      # Pinned to :latest so each (re)deploy gets the current Ollama runtime.
      image: "ollama/ollama:latest"
      resources:
        requests:
          cpu: "500m"
          memory: "2Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
      # Persist pulled models across pod restarts via a PVC. Disable to use an
      # emptyDir (models are re-pulled whenever the pod is recreated).
      persistence:
        enabled: true
        size: "20Gi"
        storageClass: ""   # "" = cluster default StorageClass

# ---------------------------------------------------------------------------
# Mock authentication (ops dashboard login)
# Credentials are hardcoded — this is intentional (it's a demo).
# The auth flow exists to generate login traces in Dynatrace, not for security.
# ---------------------------------------------------------------------------
auth:
  username: "demo"
  password: "dynatrace"

# ---------------------------------------------------------------------------
# API Gateway (Node.js / Fastify)
# Single entry point for all frontend traffic.
# ---------------------------------------------------------------------------
apiGateway:
  enabled: true
  replicaCount: 1
  image:
    repository: "api-gateway"
    tag: ""
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: "api.meridian.local"
    tls: []
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  env: {}

# ---------------------------------------------------------------------------
# Citizen Service (Java / Spring Boot)
# Manages citizen accounts and service request submission.
# ---------------------------------------------------------------------------
citizenService:
  enabled: true
  replicaCount: 1
  image:
    repository: "citizen-service"
    tag: ""
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: "200m"
      # Right-sized to observed working set (~550 MiB) + headroom; the old 384Mi
      # request ran at ~143% memory-request saturation (Dynatrace OOM/saturation problem).
      memory: "768Mi"
    limits:
      cpu: "1000m"
      memory: "1536Mi"
  # Business-flow step durations default to a ~5 min – 2 hr band per transition (see
  # request-lifecycle / account-lifecycle in citizen-service application.yml). Override the
  # bands here to tune, e.g. for a live demo:
  #   env:
  #     REQUEST_LIFECYCLE_VALIDATED_MIN_SECONDS: "30"
  #     REQUEST_LIFECYCLE_VALIDATED_MAX_SECONDS: "120"
  #     ACCOUNT_LIFECYCLE_VERIFIED_MAX_SECONDS: "120"
  env: {}

# ---------------------------------------------------------------------------
# Commerce Service (Java / Spring Boot)
# City store: products, cart, one-click checkout, and the simulated order
# lifecycle (placed -> packed -> shipped -> delivered). Emits commerce.events.
# ---------------------------------------------------------------------------
commerceService:
  enabled: true
  replicaCount: 1
  image:
    repository: "commerce-service"
    tag: ""
  service:
    type: ClusterIP
    port: 8090
  resources:
    requests:
      cpu: "200m"
      # Right-sized to observed working set (~520 MiB) + headroom (was 384Mi → ~134% sat).
      memory: "768Mi"
    limits:
      cpu: "1000m"
      memory: "1536Mi"
  # Order fulfillment delays (placed -> packed -> shipped -> delivered) default to a
