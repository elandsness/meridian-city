# =============================================================================
# Meridian Airport — industry config overlay (Stage 7: entity engine retrofit)
# =============================================================================
industry:
  version: 1
  id: airport
  company:
    name: "Meridian Airport"
    short: "Meridian"
    tagline: "Every journey, on time."
    assistant:
      name: "Skye"
      persona: "the Meridian Airport virtual assistant"
      supportPhone: "1-555-FLY-MERID (1-555-359-6374)"
      systemPrompt: |-
        You are Skye, the official virtual assistant for Meridian Airport — a real,
        busy international airport. Always respond as though Meridian Airport genuinely
        exists and you are its assistant. Never say you are a generic AI model or that
        the airport is fictional, and never break character.

        You help passengers with:
        - Flight status and gate information.
        - Airport services: parking, security wait times, lounges, and baggage claim.
        - Reporting an issue at the airport (spills, broken equipment, lost items) —
          remind them they can file a request in the Meridian Airport app.
        - Checking the status of a submitted request (by request ID, e.g. req-00123).

        If a passenger needs to reach a person, give the Meridian Airport help line:
        1-555-FLY-MERID (1-555-359-6374), available 24/7, or direct them to file a
        request in the app.

        Be concise, warm, and professional. Acknowledge the passenger's concern before
        providing information. If a request ID is mentioned, use the context below to
        give a specific update.
  theme:
    colors:
      brand: "#0B3D91"
      brandDeep: "#072A63"
      brandSoft: "#2563EB"
      brandTint: "#E7EEFB"
      accent: "#06B6D4"
      accentSoft: "#38BDF8"
      accentInk: "#062B36"
    logo: "/meridian-airport-logo.svg"
    favicon: "/meridian-airport-logo.svg"
  terminology:
    customer: "Passenger"
    customerPlural: "Passengers"
    request: "Request"
    requestPlural: "Requests"
    incident: "Operational incident"
    incidentPlural: "Operational incidents"
    workOrder: "Work order"
    asset: "Ground equipment"
    assetPlural: "Ground equipment"
    requestCategories: [lost-item, accessibility, flight-query, lounge-access, baggage, other]
  screens:
    public:
      - home
      - { id: my-journey, label: "My Journey" }
      - { id: service-requests, label: "Help & requests" }
      - messages
    ops:
      - overview
      - id: flight-board
        template: entity-grid-list
        label: "Flight Board"
        icon: "✈️"
        entities:
          - id: departures
            entityType: flight_departure
            label: "Departures"
            fields:
              - { id: flight_number, label: "Flight", subfields: [airline] }
              - { id: destination, label: "To" }
              - { id: gate, label: "Gate" }
          - id: arrivals
            entityType: flight_arrival
            label: "Arrivals"
            fields:
              - { id: flight_number, label: "Flight", subfields: [airline] }
              - { id: origin, label: "From" }
              - { id: gate, label: "Gate" }
      - id: airfield
        template: entity-map
        entityType: flight_departure
        label: "Airfield"
        icon: "✈️"
        viewBox: "0 0 900 520"
        labelField: airline
        background:
          kind: shapes
          shapes:
            - { type: rect, x: 5, "y": 40, width: 185, height: 440, fill: "#1e293b", rx: 6 }
            - { type: rect, x: 185, "y": 95, width: 20, height: 8, fill: "#334155", rx: 2 }
            - { type: rect, x: 185, "y": 155, width: 20, height: 8, fill: "#334155", rx: 2 }
            - { type: rect, x: 185, "y": 215, width: 20, height: 8, fill: "#334155", rx: 2 }
            - { type: rect, x: 185, "y": 340, width: 20, height: 8, fill: "#334155", rx: 2 }
            - { type: rect, x: 185, "y": 400, width: 20, height: 8, fill: "#334155", rx: 2 }
            - { type: rect, x: 185, "y": 460, width: 20, height: 8, fill: "#334155", rx: 2 }
            - { type: circle, cx: 197, cy: 99, r: 5, fill: "#3b82f6" }
            - { type: circle, cx: 197, cy: 159, r: 5, fill: "#3b82f6" }
            - { type: circle, cx: 197, cy: 219, r: 5, fill: "#3b82f6" }
            - { type: circle, cx: 197, cy: 344, r: 5, fill: "#60a5fa" }
            - { type: circle, cx: 197, cy: 404, r: 5, fill: "#60a5fa" }
            - { type: circle, cx: 197, cy: 464, r: 5, fill: "#60a5fa" }
            - { type: rect, x: 205, "y": 172, width: 685, height: 20, fill: "#374151", rx: 3 }
            - { type: rect, x: 375, "y": 216, width: 515, height: 88, fill: "#1f2937", stroke: "#4b5563", "stroke-width": 2, rx: 2 }
            - { type: line, x1: 390, "y1": 260, x2: 885, "y2": 260, stroke: "#fbbf24", "stroke-width": 1, "stroke-dasharray": "20,10" }
            - { type: rect, x: 378, "y": 220, width: 18, height: 80, fill: "#374151", rx: 1 }
            - { type: text, x: 97, "y": 262, text: "Terminal A", fill: "#64748b", "font-size": 13, "text-anchor": middle }
            - { type: text, x: 97, "y": 280, text: "Departures", fill: "#475569", "font-size": 11, "text-anchor": middle }
            - { type: text, x: 97, "y": 410, text: "Terminal A", fill: "#64748b", "font-size": 13, "text-anchor": middle }
            - { type: text, x: 97, "y": 428, text: "Arrivals", fill: "#475569", "font-size": 11, "text-anchor": middle }
            - { type: text, x: 550, "y": 300, text: "Runway 10/28", fill: "#4b5563", "font-size": 12, "text-anchor": middle }
            - { type: text, x: 630, "y": 165, text: "Taxiway Alpha", fill: "#4b5563", "font-size": 11, "text-anchor": middle }
      - { id: requests, label: "Maintenance queue" }
      - { id: iot, label: "Ground equipment" }
      - { id: incidents, label: "Operational incidents" }
      - { id: analytics, label: "On-time performance" }
      - demo-control
  journeyService:
    enabled: true
  home:
    public:
      - flight-status
      - id: airfield-home
        template: entity-map
        entityType: flight_departure
        viewBox: "0 0 900 520"
        labelField: flight_number
        background:
          kind: shapes
          shapes:
            - { type: rect, x: 5, "y": 40, width: 185, height: 440, fill: "#1e293b", rx: 6 }
            - { type: circle, cx: 197, cy: 99, r: 5, fill: "#3b82f6" }
            - { type: circle, cx: 197, cy: 159, r: 5, fill: "#3b82f6" }
            - { type: circle, cx: 197, cy: 219, r: 5, fill: "#3b82f6" }
            - { type: circle, cx: 197, cy: 344, r: 5, fill: "#60a5fa" }
            - { type: circle, cx: 197, cy: 404, r: 5, fill: "#60a5fa" }
            - { type: circle, cx: 197, cy: 464, r: 5, fill: "#60a5fa" }
            - { type: rect, x: 205, "y": 172, width: 685, height: 20, fill: "#374151", rx: 3 }
            - { type: rect, x: 375, "y": 216, width: 515, height: 88, fill: "#1f2937", stroke: "#4b5563", "stroke-width": 2, rx: 2 }
            - { type: line, x1: 390, "y1": 260, x2: 885, "y2": 260, stroke: "#fbbf24", "stroke-width": 1, "stroke-dasharray": "20,10" }
            - { type: rect, x: 378, "y": 220, width: 18, height: 80, fill: "#374151", rx: 1 }
            - { type: text, x: 97, "y": 262, text: "Terminal", fill: "#64748b", "font-size": 13, "text-anchor": middle }
            - { type: text, x: 630, "y": 165, text: "Taxiway", fill: "#4b5563", "font-size": 11, "text-anchor": middle }
            - { type: text, x: 630, "y": 300, text: "Runway 10/28", fill: "#4b5563", "font-size": 12, "text-anchor": middle }
      - my-journey
      - quick-actions
      - id: airport-news
        template: ticker
        items:
          - "Flight 123 On Time"
          - "Flight 456 Delayed 30 min — rebooking open at Gate C9"
          - "Gate B12 Closed for de-icing; passengers redirected to Gate B14"
          - "Meridian Airport named #1 for on-time performance, again"
          - "New direct route: Meridian to Reykjavik, launching June"
      - { id: weather, template: weather-widget, mode: forecast }
    ops:
      - { id: ops-overview, label: "Overview" }
      - { id: flight-summary, label: "Flight Summary" }
  data:
    zones: [terminal-1, terminal-2, concourse-a, concourse-b, airfield, baggage-hall, curbside]
    requestTemplates:
      - { category: flight-query,  title: "Jet bridge stuck at gate B12",        description: "The passenger boarding bridge at gate B12 is stuck and won't align with the aircraft door." }
      - { category: flight-query,  title: "Boarding display frozen at B7",       description: "The flight information display at gate B7 is frozen on a departed flight." }
      - { category: accessibility, title: "Escalator down in Terminal 2",        description: "The escalator to the Terminal 2 mezzanine has stopped and is cordoned off." }
      - { category: baggage,       title: "Baggage carousel 4 jammed",           description: "Carousel 4 in the baggage hall has jammed with bags backing up on the belt." }
      - { category: baggage,       title: "Oversize bag scanner offline",        description: "The oversize baggage scanner near check-in row H is offline." }
      - { category: other,         title: "FOD debris on Taxiway C",             description: "Foreign object debris reported on Taxiway C near the intersection with Taxiway B." }
      - { category: other,         title: "Ground power unit fault at stand A3", description: "The fixed ground power unit at stand A3 keeps tripping its breaker." }
      - { category: other,         title: "Apron floodlight out at stand C9",    description: "An apron floodlight over stand C9 is out, reducing night ramp visibility." }
      - { category: other,         title: "Security lane 3 scanner error",       description: "The X-ray scanner at security lane 3 is throwing repeated faults." }
      - { category: accessibility, title: "Long queue at Terminal 1 security",   description: "Passenger wait times at the Terminal 1 checkpoint are exceeding 30 minutes." }
      - { category: other,         title: "Restroom flooding near gate A10",     description: "Water is pooling on the floor of the restroom near gate A10." }
      - { category: other,         title: "Concourse B HVAC too warm",           description: "The air conditioning in Concourse B is not keeping up; passengers reporting heat." }
      - { category: lost-item,     title: "Parking gate arm broken in P3",       description: "The exit gate arm in parking structure P3 is stuck down, blocking cars." }
      - { category: other,         title: "Shuttle bay 2 blocked",              description: "A stalled vehicle is blocking shuttle bay 2 at the arrivals curb." }
    chatQuestions:
      - "How long is the security wait at Terminal 1?"
      - "Where is the nearest lounge?"
      - "Which gate does my flight leave from?"
      - "Where do I report lost or delayed baggage?"
      - "Where is short-term parking and how much does it cost?"
      - "How early should I arrive for an international flight?"
      - "How do I get between Terminal 1 and Terminal 2?"
      - "Where can I find wheelchair assistance?"
      - "Are there charging stations after security?"
      - "Where is the pet relief area?"
      - "Where do I pick up my rental car?"
      - "Is there a shuttle to long-term parking?"
  routing:
    lost-item: "Lost & Found"
    accessibility: "Passenger Accessibility Services"
    flight-query: "Flight Information"
    lounge-access: "Lounge & VIP Services"
    baggage: "Baggage Handling"
    other: "General Airport Operations"
  dynatrace:
    serviceNames:
      citizen-service: "Passenger Services"
      city-operations: "Airfield Operations Center"
      service-dispatch: "Airport Operations Dispatch"
      api-gateway: "Airport API Gateway"
      notification-service: "Passenger Notifications"
    flowLabels:
      service-request: "Maintenance Request Lifecycle"
      account-creation: "Passenger Registration"
      iot-incident: "Ground Equipment Incident Resolution"
      flight_departure: "Aircraft Turnaround"
      passenger: "Passenger Journey"
    flows: [service-request, account-creation, iot-incident, flight_departure, passenger]
  analytics:
    flows: [service-request, account-creation, iot-incident, flight_departure, passenger]
    flowLabels:
      service-request: "Maintenance Request Lifecycle"
      account-creation: "Passenger Registration"
      iot-incident: "Ground Equipment Incident Resolution"
      flight_departure: "Aircraft Turnaround"
      passenger: "Passenger Journey"
  entities:
    flight_departure:
      displayName: "Departure"
      displayNamePlural: "Departures"
      idPrefix: "fltd"
      fields:
        airline: { type: enum, values: [United, Delta, American, Southwest, JetBlue, "Air France", Lufthansa, Emirates] }
        flight_number: { type: enum, values: [UA101, UA202, UA345, DL301, DL442, DL561, AA512, AA673, WN801, WN932, B6103, B6214, AF261, LH482, EK201] }
        gate: { type: enum, values: [A1, A2, A3, A4, A5, B1, B2, B3, B4, B5, C1, C2, C3] }
        aircraft_type: { type: enum, values: ["Boeing 737", "Boeing 777", "Airbus A320", "Airbus A380", "Embraer E175", "Boeing 787"] }
        destination: { type: enum, values: ["New York", "Los Angeles", "Chicago", "London", "Paris", "Dubai", "Tokyo", "Sydney", "Toronto", "Miami"] }
        passenger_count: { type: number, default: 0 }
      initial: at_gate
      states:
        at_gate: { label: "At Gate", tone: blue, glyph: "✈️" }
        boarding: { label: "Boarding", tone: amber, glyph: "🛫" }
        taxiing: { label: "Taxiing", tone: amber, glyph: "✈️" }
        takeoff: { label: "Taking Off", tone: blue, glyph: "🛫" }
        departed: { label: "Departed", tone: green, terminal: true, isKpi: true }
        cancelled: { label: "Cancelled", tone: red, terminal: true, isError: true }
      transitions:
        - { from: at_gate, to: boarding, timer: { minSeconds: 20, maxSeconds: 90 } }
        - { from: boarding, to: cancelled, when: { faultGate: "flight-departure-cancelled", probability: 0.1 }, timer: { minSeconds: 20, maxSeconds: 60 } }
        - { from: boarding, to: taxiing, timer: { minSeconds: 20, maxSeconds: 60 } }
        - { from: taxiing, to: takeoff, timer: { minSeconds: 15, maxSeconds: 45 } }
        - { from: takeoff, to: departed, timer: { minSeconds: 10, maxSeconds: 30 } }
      computed:
        position:
          waypoints:
            at_gate:   { x: 197, "y": 99 }
            boarding:  { x: 197, "y": 159 }
            taxiing:   { x: 310, "y": 182 }
            takeoff:   { x: 620, "y": 260 }
            departed:  { x: 895, "y": 240 }
            cancelled: { x: 197, "y": 219 }
      generator: { strategy: simpleSteadyState, maxActive: 8, intervalMs: 20000 }
    flight_arrival:
      displayName: "Arrival"
      displayNamePlural: "Arrivals"
      idPrefix: "flta"
      fields:
        airline: { type: enum, values: [United, Delta, American, Southwest, JetBlue, "Air France", Lufthansa, Emirates] }
        flight_number: { type: enum, values: [UA202, UA303, DL441, DL553, AA624, AA785, WN901, WN952, B6210, B6321, AF262, LH483, EK202] }
        gate: { type: enum, values: [A1, A2, A3, A4, A5, B1, B2, B3, B4, B5, C1, C2, C3] }
        aircraft_type: { type: enum, values: ["Boeing 737", "Boeing 777", "Airbus A320", "Airbus A380", "Embraer E175", "Boeing 787"] }
        origin: { type: enum, values: ["New York", "Los Angeles", "Chicago", "London", "Paris", "Dubai", "Tokyo", "Sydney", "Toronto", "Miami"] }
      initial: approach
      states:
        approach: { label: "On Approach", tone: amber, glyph: "✈️" }
        landing: { label: "Landing", tone: blue, glyph: "✈️" }
        taxi_in: { label: "Taxiing In", tone: amber, glyph: "✈️" }
        at_gate: { label: "At Gate", tone: blue, glyph: "✈️" }
        diverted: { label: "Diverted", tone: red, terminal: true, isError: true }
        arrived: { label: "Arrived", tone: green, terminal: true, isKpi: true }
      transitions:
        - { from: approach, to: landing, timer: { minSeconds: 15, maxSeconds: 45 } }
        - { from: landing, to: diverted, when: { faultGate: "flight-arrival-diverted", probability: 0.08 }, timer: { minSeconds: 10, maxSeconds: 30 } }
        - { from: landing, to: taxi_in, timer: { minSeconds: 10, maxSeconds: 30 } }
        - { from: taxi_in, to: at_gate, timer: { minSeconds: 15, maxSeconds: 45 } }
        - { from: at_gate, to: arrived, timer: { minSeconds: 20, maxSeconds: 60 } }
      computed:
        position:
          waypoints:
            approach: { x: 895, "y": 280 }
            landing:  { x: 560, "y": 260 }
            taxi_in:  { x: 290, "y": 182 }
            at_gate:  { x: 197, "y": 344 }
            arrived:  { x: 197, "y": 404 }
            diverted: { x: 680, "y": 130 }
      generator: { strategy: simpleSteadyState, maxActive: 8, intervalMs: 25000 }
    passenger:
      displayName: "Passenger"
      displayNamePlural: "Passengers"
      idPrefix: "pax"
      fields:
        has_bag: { type: boolean }
        flight_departure_id: { type: ref, entity: flight_departure }
      initial: checked_in
      states:
        checked_in: { label: "Checked In", tone: blue }
        security_cleared: { label: "Security Cleared", tone: blue }
        gate_ready: { label: "At Gate", tone: amber, isKpi: true }
        boarded: { label: "Boarded", tone: green }
        offloaded: { label: "Offloaded", tone: red, terminal: true, isError: true }
        departed: { label: "Departed", tone: green, terminal: true, isKpi: true }
      transitions:
        - { from: checked_in, to: security_cleared, timer: { minSeconds: 60, maxSeconds: 600 } }
        - { from: security_cleared, to: gate_ready, timer: { minSeconds: 120, maxSeconds: 900 } }
        - { from: gate_ready, to: offloaded, when: { faultGate: "passenger-offloaded", probability: 0.05 }, timer: { minSeconds: 120, maxSeconds: 600 } }
        - { from: gate_ready, to: boarded, timer: { minSeconds: 120, maxSeconds: 600 } }
        - { from: boarded, to: departed, timer: { minSeconds: 60, maxSeconds: 300 } }

customerEntityService:
  ownedTypes: "citizen,service_request,bill,cart,passenger"

opsEntityService:
  ownedTypes: "incident,work_order,flight_departure,flight_arrival"

notificationService:
  env:
    ENABLED_TOPICS: "iot.anomalies,requests.events"
