industry:
  version: 1
  id: airport
  primaryFlow: "aircraft_turnaround"
  
  company:
    name: "Meridian International Airport"
    short: "Meridian Int'l"
    tagline: "Precision in every takeoff."
    assistant:
      name: "Skye"
      persona: "the Meridian Airport virtual assistant"
      supportPhone: "1-555-FLY-MERID (1-555-359-6374)"
      systemPrompt: |
        You are Skye, the official virtual assistant for Meridian International Airport. 
        Provide real-time flight status, security wait times, and baggage help. 
        Be professional, concise, and helpful.
  
  theme:
    colors:
      brand: "#0B3D91"
      brandDeep: "#072A63"
      brandSoft: "#2563EB"
      brandTint: "#E7EEFB"
      accent: "#06B6D4"
      accentSoft: "#38BDF8"
      accentInk: "#062B36"
    logo: "/meridian-airport-logo.svg"
    favicon: "/meridian-airport-logo.svg"

  terminology:
    customer: "Passenger"
    customerPlural: "Passengers"
    request: "Request"
    requestPlural: "Requests"
    incident: "Operational incident"
    incidentPlural: "Operational incidents"
    workOrder: "Work order"
    asset: "Ground equipment"
    assetPlural: "Ground equipment"
    requestCategories: ["lost-item", "accessibility", "flight-query", "lounge-access", "baggage", "other"]

  screens:
    public:
      - "home"
      - { id: "my-journey", label: "My Journey", template: "entity-journey", entityType: "passenger" }
      - { id: "account-status", label: "Account Status", template: "entity-journey", entityType: "passenger_account" }
      - id: "service-requests"
        label: "Help & requests"
        template: "entity-grid-list"
        entities:
          - id: "requests"
            entityType: "service_request"
            label: "Requests"
      - "messages"
    ops:
      - "overview"
      - id: "flight-board"
        template: entity-grid-list
        label: "Flight Board"
        icon: "✈️"
        entities:
          - id: "departures"
            entityType: "flight_departure"
            label: "Departures"
            fields:
              - { id: "flight_number", label: "Flight", subfields: ["airline"] }
              - { id: "destination", label: "To" }
              - { id: "gate", label: "Gate" }
          - id: "arrivals"
            entityType: "flight_arrival"
            label: "Arrivals"
            fields:
              - { id: "flight_number", label: "Flight", subfields: ["airline"] }
              - { id: "origin", label: "From" }
              - { id: "gate", label: "Gate" }
      - id: airfield
        template: "entity-map"
        entityType: "flight_departure"
        label: "Airfield"
        icon: "✈️"
        viewBox: "0 0 900 520"
        labelField: "flight_number"
        background:
          kind: "shapes"
          shapes:
            - { type: "rect", x: 5, "y": 40, width: 185, height: 440, fill: "#1e293b", rx: 6 }
            - { type: "rect", x: 185, "y": 95, width: 20, height: 8, fill: "#335533", rx: 2 }
            - { type: "rect", x: 185, "y": 155, width: 20, height: 8, fill: "#335533", rx: 2 }
            - { type: "rect", x: 185, "y": 215, width: 20, height: 8, fill: "#335533", rx: 2 }
            - { type: "rect", x: 185, "y": 340, width: 20, height: 8, fill: "#335533", rx: 2 }
            - { type: "rect", x: 185, "y": 400, width: 20, height: 8, fill: "#335533", rx: 2 }
            - { type: "rect", x: 185, "y": 460, width: 20, height: 8, fill: "#335533", rx: 2 }
            - { type: "rect", x: 205, "y": 172, width: 685, height: 20, fill: "#374151", rx: 3 }
            - { type: "rect", x: 375, "y": 216, width: 515, height: 88, fill: "#1f2937", stroke: "#4b5563", stroke-width: 2, rx: 2 }
            - { type: "line", x1: 390, "y1": 260, x2: 885, "y2": 260, stroke: "#fbbf24", stroke-width: 1, stroke-dasharray: "20,10" }
            - { type: "text", x: 97, "y": 262, text: "Terminal A", fill: "#64748b", font-size: 13, text-anchor: middle }
            - { type: "text", x: 550, "y": 300, text: "Runway 10/28", fill: "#4b5563", font-size: 12, text-anchor: middle }
      - id: "turnaround-ops"
        label: "Aircraft Turnaround"
        template: "entity-list"
        entityType: "aircraft"
      - id: "luggage-ops"
        label: "Luggage Tracking"
        template: "entity-list"
        entityType: "luggage"
      - { id: "analytics", label: "On-time performance" }
      - { id: "demo-control", label: "Demo Control", icon: "⚙️" }

  home:
    public:
      - "flight-status"
      - id: "airfield-home"
        template: "entity-map"
        entityType: "flight_departure"
        viewBox: "0 0 900 520"
        labelField: "flight_number"
        background:
          kind: "shapes"
          shapes:
            - { type: "rect", x: 5, "y": 40, width: 185, height: 440, fill: "#1e293b", rx: 6 }
            - { type: "rect", x: 205, "y": 172, width: 685, height: 20, fill: "#374151", rx: 3 }
            - { type: "rect", x: 375, "y": 216, width: 515, height: 88, fill: "#1f2937", stroke: "#4b5563", stroke-width: 2, rx: 2 }
      - "my-journey"
    ops:
      - { id: "ops-overview", label: "Overview" }
      - { id: "flight-summary", label: "Flight Summary" }

  data:
    zones: ["terminal-1", "terminal-2", "concourse-a", "concourse-b", "airfield", "baggage-hall", "curbside"]
    requestTemplates:
      - { category: "baggage", title: "Delayed suitcase", description: "Suitcase not arrived on carousel 4." }
      - { category: "flight-query", title: "Jet bridge failure", description: "Gate B12 bridge is stuck." }
      - { category: "other", title: "FOD on Runway", description: "Debris spotted on Runway 10." }
    chatQuestions:
      - "Where is my bag?"
      - "What is the security wait time?"

  routing:
    "lost-item": "Lost & Found"
    "accessibility": "Passenger Accessibility"
    "flight-query": "Flight Operations"
    "lounge-access": "VIP Services"
    "baggage": "Baggage Handling"
    "other": "General Airport Ops"

  dynatrace:
    serviceNames:
      "citizen-service": "Passenger Services"
      "city-operations": "Airfield Ops Center"
      "service-dispatch": "Airport Dispatch"
      "api-gateway": "Airport Gateway"
      "notification-service": "Passenger Alerts"
    flowLabels:
      "passenger-journey": "Passenger Journey"
      "aircraft-turnaround": "Aircraft Turnaround"
      "luggage": "Luggage Logistics"
      "flight_departure": "Departure Flow"
      "flight_arrival": "Arrival Flow"
    flows:
      - { id: "passenger-journey", correlationID: "passenger.id" }
      - { id: "aircraft-turnaround", correlationID: "aircraft.id" }
      - { id: "luggage", correlationID: "luggage.id" }
      - { id: "flight_departure", correlationID: "flight_departure.id" }
      - { id: "flight_arrival", correlationID: "flight_arrival.id" }

  entities:
    passenger:
      displayName: "Passenger"
      displayNamePlural: "Passengers"
      idPrefix: "pax"
      fields:
        has_bag: { type: "boolean" }
        name: { type: "string" }
      initial: "checked_in"
      sequence: ["checked_in", "bag_drop", "security_cleared", "gate_ready", "boarded", "departed"]
      states:
        checked_in: { label: "Checked In", tone: "blue", glyph: "🎟️" }
        bag_drop: { label: "Baggage Drop", tone: "blue", glyph: "💼" }
        security_cleared: { label: "Security Cleared", tone: "blue", glyph: "🛡️" }
        gate_ready: { label: "At Gate", tone: "amber", glyph: "🛫", isKpi: true }
        boarded: { label: "Boarded", tone: "green", glyph: "✅" }
        departed: { label: "Departed", tone: "green", terminal: true, isKpi: true }
      transitions:
        - from: "checked_in"
          to: "bag_drop"
          when: { probability: 0.7 }
          timer: { minSeconds: 30, maxSeconds: 120 }
          signal: { eventType: "passenger.bag_drop", correlationId: "passenger.id" }
        - from: "checked_in"
          to: "security_cleared"
          when: { probability: 0.3 }
          timer: { minSeconds: 30, maxSeconds: 120 }
          signal: { eventType: "passenger.security_cleared", correlationId: "passenger.id" }
        - from: "bag_drop"
          to: "security_cleared"
          timer: { minSeconds: 60, maxSeconds: 300 }
          signal: { eventType: "passenger.security_cleared", correlationId: "passenger.id" }
        - from: "security_cleared"
          to: "gate_ready"
          timer: { minSeconds: 120, maxSeconds: 600 }
          signal: { eventType: "passenger.gate_ready", correlationId: "passenger.id" }
        - from: "gate_ready"
          to: "boarded"
          timer: { minSeconds: 120, maxSeconds: 600 }
          signal: { eventType: "passenger.boarded", correlationId: "passenger.id" }
        - from: "boarded"
          to: "departed"
          timer: { minSeconds: 60, maxSeconds: 300 }
          signal: { eventType: "passenger.departed", correlationId: "passenger.id" }
      generator: { strategy: "simpleSteadyState", maxActive: 60, intervalMs: 25000 }

    luggage:
      displayName: "Luggage"
      displayNamePlural: "Luggage"
      idPrefix: "bag"
      fields:
        passenger_id: { type: "ref", entity: "passenger" }
        weight: { type: "number" }
      initial: "checked_in"
      states:
        checked_in: { label: "Checked In", tone: "blue", glyph: "💼" }
        security_scan: { label: "Security Scan", tone: "blue", glyph: "🔍" }
        sorted: { label: "Sorted", tone: "blue", glyph: "📦" }
        transferred: { label: "Transferred to Plane", tone: "amber", glyph: "✈️" }
        claimed: { label: "Claimed", tone: "green", terminal: true, isKpi: true }
      transitions:
        - from: "checked_in"
          to: "security_scan"
          timer: { minSeconds: 60, maxSeconds: 180 }
          signal: { eventType: "luggage.security_scan", correlationId: "luggage.id" }
        - from: "security_scan"
          to: "sorted"
          timer: { minSeconds: 60, maxSeconds: 300 }
          signal: { eventType: "luggage.sorted", correlationId: "luggage.id" }
        - from: "sorted"
          to: "transferred"
          timer: { minSeconds: 120, maxSeconds: 600 }
          signal: { eventType: "luggage.transferred", correlationId: "luggage.id" }
        - from: "transferred"
          to: "claimed"
          timer: { minSeconds: 1200, maxSeconds: 3600 }
          signal: { eventType: "luggage.claimed", correlationId: "luggage.id" }
      generator: { strategy: "simpleSteadyState", maxActive: 60, intervalMs: 25000 }

    aircraft:
      displayName: "Aircraft"
      displayNamePlural: "Aircraft"
      idPrefix: "ac"
      fields:
        tail_number: { type: "string" }
        type: { type: "string" }
      initial: "at_gate"
      states:
        at_gate: { label: "At Gate", tone: "blue", glyph: "✈️" }
        cleaning: { label: "Cleaning", tone: "blue", glyph: "🧹" }
        refueling: { label: "Refueling", tone: "blue", glyph: "⛽" }
        catering: { label: "Catering", tone: "blue", glyph: "🍱" }
        preflight_checks: { label: "Preflight Checks", tone: "amber", glyph: "📋" }
        boarded: { label: "Boarded", tone: "amber", glyph: "👥" }
        push_back: { label: "Push Back", tone: "green", terminal: true, isKpi: true }
      transitions:
        - from: "at_gate"
          to: "cleaning"
          timer: { minSeconds: 60, maxSeconds: 300 }
          signal: { eventType: "aircraft.cleaning", correlationId: "aircraft.id" }
        - from: "cleaning"
          to: "refueling"
          timer: { minSeconds: 60, maxSeconds: 300 }
          signal: { eventType: "aircraft.refueling", correlationId: "aircraft.id" }
        - from: "refueling"
          to: "catering"
          timer: { minSeconds: 60, maxSeconds: 300 }
          signal: { eventType: "aircraft.catering", correlationId: "aircraft.id" }
        - from: "catering"
          to: "preflight_checks"
          timer: { minSeconds: 60, maxSeconds: 180 }
          signal: { eventType: "aircraft.preflight", correlationId: "aircraft.id" }
        - from: "preflight_checks"
          to: "boarded"
          timer: { minSeconds: 120, maxSeconds: 600 }
          signal: { eventType: "aircraft.boarded", correlationId: "aircraft.id" }
        - from: "boarded"
          to: "push_back"
          timer: { minSeconds: 60, maxSeconds: 300 }
          signal: { eventType: "aircraft.push_back", correlationId: "aircraft.id" }
      generator: { strategy: "simpleSteadyState", maxActive: 5, intervalMs: 60000 }

    flight_departure:
      displayName: "Departure"
      displayNamePlural: "Departures"
      idPrefix: "fltd"
      fields:
        flight_number: { type: "string" }
        destination: { type: "string" }
        gate: { type: "string" }
      initial: "at_gate"
      states:
        at_gate: { label: "At Gate", tone: "blue", glyph: "✈️" }
        boarding: { label: "Boarding", tone: "amber", glyph: "🛫" }
        taxiing: { label: "Taxiing", tone: "amber", glyph: "✈️" }
        takeoff: { label: "Taking Off", tone: "blue", glyph: "🛫" }
        departed: { label: "Departed", tone: "green", terminal: true, isKpi: true }
      transitions:
        - from: "at_gate"
          to: "boarding"
          timer: { minSeconds: 30, maxSeconds: 90 }
          signal: { eventType: "flight.boarding", correlationId: "flight_departure.id" }
        - from: "boarding"
          to: "taxiing"
          timer: { minSeconds: 60, maxSeconds: 180 }
          signal: { eventType: "flight.taxiing", correlationId: "flight_departure.id" }
        - from: "taxiing"
          to: "takeoff"
          timer: { minSeconds: 30, maxSeconds: 90 }
          signal: { eventType: "flight.takeoff", correlationId: "flight_departure.id" }
        - from: "takeoff"
          to: "departed"
          timer: { minSeconds: 30, maxSeconds: 120 }
          signal: { eventType: "flight.departed", correlationId: "flight_departure.id" }
      computed:
        position:
          type: point2d
          interpolation: linear
          paths:
            at_gate: [{ "x": 197, "y": 99 }]
            boarding: [{ "x": 197, "y": 159 }]
            taxiing: [{ "x": 197, "y": 159 }, { "x": 250, "y": 159 }, { "x": 310, "y": 182 }, { "x": 450, "y": 182 }]
            takeoff: [{ "x": 450, "y": 182 }, { "x": 550, "y": 230 }, { "x": 620, "y": 260 }, { "x": 895, "y": 240 }]
            departed: [{ "x": 895, "y": 240 }]
      generator:
        strategy: "simpleSteadyState"
        maxActive: 8
        intervalMs: 20000
        fields:
          flight_number: [{ values: ["SK102", "SK441", "LH902", "AF112", "BA203", "DL449", "AA881", "EK201"] }]
          destination: [{ values: ["London LHR", "New York JFK", "Tokyo HND", "Paris CDG", "Dubai DXB", "Singapore SIN", "Frankfurt FRA"] }]
          gate: [{ values: ["A1", "A2", "B5", "B12", "C3", "D8"] }]

    flight_arrival:
      displayName: "Arrival"
      displayNamePlural: "Arrivals"
      idPrefix: "flta"
      fields:
        flight_number: { type: "string" }
        origin: { type: "string" }
        gate: { type: "string" }
      initial: "approach"
      states:
        approach: { label: "On Approach", tone: "amber", glyph: "✈️" }
        landing: { label: "Landing", tone: "blue", glyph: "✈️" }
        taxi_in: { label: "Taxiing In", tone: "amber", glyph: "✈️" }
        at_gate: { label: "At Gate", tone: "blue", glyph: "✈️" }
        arrived: { label: "Arrived", tone: "green", terminal: true, isKpi: true }
      transitions:
        - from: "approach"
          to: "landing"
          timer: { minSeconds: 30, maxSeconds: 90 }
          signal: { eventType: "flight.landing", correlationId: "flight_arrival.id" }
        - from: "landing"
          to: "taxi_in"
          timer: { minSeconds: 60, maxSeconds: 180 }
          signal: { eventType: "flight.taxi_in", correlationId: "flight_arrival.id" }
        - from: "taxi_in"
          to: "at_gate"
          timer: { minSeconds: 60, maxSeconds: 300 }
          signal: { eventType: "flight.at_gate", correlationId: "flight_arrival.id" }
        - from: "at_gate"
          to: "arrived"
          timer: { minSeconds: 120, maxSeconds: 600 }
          signal: { eventType: "flight.arrived", correlationId: "flight_arrival.id" }
      computed:
        position:
          type: point2d
          interpolation: linear
          paths:
            approach: [{ "x": 895, "y": 280 }, { "x": 750, "y": 280 }, { "x": 650, "y": 270 }]
            landing: [{ "x": 650, "y": 270 }, { "x": 560, "y": 260 }]
            taxi_in: [{ "x": 560, "y": 260 }, { "x": 400, "y": 260 }, { "x": 310, "y": 182 }, { "x": 290, "y": 182 }]
            at_gate: [{ "x": 290, "y": 182 }, { "x": 197, "y": 344 }]
            arrived: [{ "x": 197, "y": 404 }]
      generator:
        strategy: "simpleSteadyState"
        maxActive: 8
        intervalMs: 25000
        fields:
          flight_number: [{ values: ["SK102", "SK441", "LH902", "AF112", "BA203", "DL449", "AA881", "EK201"] }]
          origin: [{ values: ["London LHR", "New York JFK", "Tokyo HND", "Paris CDG", "Dubai DXB", "Singapore SIN", "Frankfurt FRA"] }]
          gate: [{ values: ["A1", "A2", "B5", "B12", "C3", "D8"] }]

    service_request:
      displayName: "Service Request"
      displayNamePlural: "Service Requests"
      idPrefix: "req"
      fields:
        passenger_id: { type: "string" }
        category: { type: "string" }
        priority: { type: "enum", values: ["low", "normal", "high", "urgent"], default: "normal" }
        title: { type: "string" }
        description: { type: "string" }
      initial: "submitted"
      states:
        submitted: { label: "Submitted", tone: "slate" }
        validated: { label: "Validated", tone: "blue" }
        in_progress: { label: "In Progress", tone: "amber", isKpi: true }
        resolved: { label: "Resolved", tone: "green", terminal: true, isKpi: true }
      transitions:
        - from: "submitted"
          to: "validated"
          timer: { minSeconds: 300, maxSeconds: 7200 }
          signal: { eventType: "request.validated", correlationId: "service_request.id" }
        - from: "validated"
          to: "in_progress"
          timer: { minSeconds: 300, maxSeconds: 7200 }
          signal: { eventType: "request.in_progress", correlationId: "service_request.id" }
        - from: "in_progress"
          to: "resolved"
          timer: { minSeconds: 300, maxSeconds: 7200 }
          signal: { eventType: "request.resolved", correlationId: "service_request.id" }
      generator: { strategy: "simpleSteadyState", maxActive: 15, intervalMs: 30000 }

customerEntityService:
  ownedTypes: "passenger,service_request"

journeyService:
  enabled: true
  replicaCount: 1
  image:
    repository: journey-service
    tag: branch-feat-semantic-engine
  lifecycle:
    enabled: true
    minSeconds: 60
    maxSeconds: 300
  generator:
    maxActive: 50
    passengerMaxActive: 50
    bagProbability: 0.7
    entityTypes: ["passenger"]
    routes: []
    initialStatuses:
      passenger: "checked_in"
      flight: "at_gate"
  service:
    type: ClusterIP
    port: 8093
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi

opsEntityService:
  ownedTypes: "aircraft,luggage,flight_departure,flight_arrival"