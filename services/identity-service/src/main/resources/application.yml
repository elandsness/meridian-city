spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:meridian-db-rw:5432}/${DB_NAME:meridian}
    username: ${DB_USERNAME:meridian}
    password: ${DB_PASSWORD:meridian-secret-change-me}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity
    show-sql: false

  flyway:
    schemas: identity
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:meridian-kafka-bootstrap:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: identity.registered:com.meridian.identity.domain.Identity

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.meridian.identity: INFO
    org.springframework.kafka: INFO
