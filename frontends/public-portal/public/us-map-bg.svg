<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg">
  <!-- Ocean -->
  <rect width="1000" height="580" fill="#0a1628" rx="6"/>

  <!-- Continental US landmass (equirectangular, lon -127→-65, lat 24→50) -->
  <!-- x = (lon+127)/62*1000   y = (50-lat)/26*580 -->
  <path fill="#162033" stroke="#1e3a5f" stroke-width="1.5" stroke-linejoin="round"
    d="M 80,22
       L 84,38 L 76,65 L 68,84 L 72,110 L 67,145 L 62,183
       L 81,276 L 167,394
       L 205,394 L 340,411 L 449,510 L 467,546 L 480,536
       L 506,467 L 575,475 L 618,444 L 658,443 L 721,463
       L 739,546 L 730,526 L 721,484 L 704,446
       L 713,407 L 763,369 L 801,334 L 799,291
       L 827,213 L 887,183 L 938,122 L 924,67
       L 880,117 L 822,139 L 809,158 L 772,183
       L 737,194 L 703,184 L 686,93 L 649,92
       L 559,77 L 483,22 Z"/>

  <!-- Great Lakes -->
  <path fill="#0a1628" opacity="0.85"
    d="M 563,54 L 612,42 L 667,57 L 694,80 L 673,95 L 649,92 L 612,90 L 573,80 Z"/>
  <path fill="#0a1628" opacity="0.85"
    d="M 637,92 L 651,85 L 663,130 L 652,188 L 637,178 L 630,145 Z"/>
  <path fill="#0a1628" opacity="0.85"
    d="M 675,95 L 713,98 L 722,140 L 703,160 L 675,145 Z"/>
  <path fill="#0a1628" opacity="0.85"
    d="M 703,184 L 737,176 L 764,181 L 773,193 L 744,200 L 707,197 Z"/>
  <path fill="#0a1628" opacity="0.85"
    d="M 803,163 L 839,156 L 858,170 L 835,180 L 805,176 Z"/>

  <!-- Interior state borders (simplified) -->
  <g stroke="#1e3350" stroke-width="0.8" fill="none">
    <!-- Pacific states east edge ~lon -120 → x=113 -->
    <polyline points="113,22 113,295 167,394"/>
    <!-- Rockies east edge ~lon -104 → x=371 -->
    <line x1="371" y1="22" x2="371" y2="411"/>
    <!-- Plains / Mississippi ~lon -91 → x=581 -->
    <polyline points="581,82 581,295 565,475"/>
    <!-- Appalachians ~lon -84 → x=694 -->
    <line x1="694" y1="160" x2="694" y2="446"/>
    <!-- Great Plains mid lat ~lat 37 → y=302 -->
    <polyline points="371,302 530,302 581,302"/>
    <!-- Southern mid lat ~lat 36 → y=324 -->
    <polyline points="581,324 800,324"/>
    <!-- TX east border ~lon -94 → x=516 -->
    <line x1="516" y1="302" x2="508" y2="467"/>
    <!-- Mid-Atlantic / New England ~lon -73 → x=877 -->
    <line x1="877" y1="118" x2="827" y2="213"/>
  </g>

  <!-- Region dashed dividers matching the dot zones -->
  <line x1="300" y1="40" x2="300" y2="545"
        stroke="#2a4a7a" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="620" y1="40" x2="620" y2="545"
        stroke="#2a4a7a" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="620" y1="290" x2="990" y2="290"
        stroke="#2a4a7a" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- Region labels -->
  <text x="155" y="552" text-anchor="middle" font-size="10"
        fill="#3a5a8a" font-family="system-ui,sans-serif" letter-spacing="2.5"
        font-weight="500">WEST COAST</text>
  <text x="460" y="552" text-anchor="middle" font-size="10"
        fill="#3a5a8a" font-family="system-ui,sans-serif" letter-spacing="2.5"
        font-weight="500">MIDWEST</text>
  <text x="810" y="72" text-anchor="middle" font-size="10"
        fill="#3a5a8a" font-family="system-ui,sans-serif" letter-spacing="2.5"
        font-weight="500">NORTHEAST</text>
  <text x="810" y="552" text-anchor="middle" font-size="10"
        fill="#3a5a8a" font-family="system-ui,sans-serif" letter-spacing="2.5"
        font-weight="500">SOUTHEAST</text>
  <text x="460" y="378" text-anchor="middle" font-size="10"
        fill="#3a5a8a" font-family="system-ui,sans-serif" letter-spacing="2.5"
        font-weight="500">DIGITAL CHANNELS</text>
</svg>
